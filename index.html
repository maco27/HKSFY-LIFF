<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>交通費メーター</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://api.line.me">
<link rel="preconnect" href="https://static.line-scdn.net">
<link rel="preconnect" href="https://www.googleapis.com">
<style>
  /* ===== Material 3 Expressive のカラーロール（色は最小限：メイン／薄いメイン／白／グレー／赤＋手入力の緑・要確認の黄） ===== */
  :root {
    --primary: #2F5BA8; --on-primary: #FFFFFF;
    --primary-container: #D8E2FF; --on-primary-container: #001A43;
    --surface: #FFFFFF; --surface-c: #F3F4F8; --surface-ch: #E9EBF1; --on-surface: #1A1C20; --on-surface-v: #5B5F68;
    --outline-v: #D5D8E0;
    --inverse: #2F3036; --on-inverse: #F1F0F7; --inverse-primary: #AEC6FF;
    --error: #BA1A1A; --manual: #1B7A45; --warn: #8A5A00;
    --man-c: #C6EFD3; --on-man-c: #0A3A1E; --warn-c: #FFDDAA; --on-warn-c: #3D2800; --bad-c: #FFD6D1; --on-bad-c: #5C0006;
    --odo: #202226;
    --hdr: 64px;
    --spring: cubic-bezier(.3, 1.35, .5, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #AEC6FF; --on-primary: #002E6A; --primary-container: #1B4489; --on-primary-container: #D8E2FF;
      --surface: #111318; --surface-c: #1C1F25; --surface-ch: #272A31; --on-surface: #E2E2E9; --on-surface-v: #C4C6D0;
      --outline-v: #3A3E46; --inverse: #E2E2E9; --on-inverse: #2F3036; --inverse-primary: #2F5BA8;
      --error: #FFB4AB; --manual: #7FD99E; --warn: #FFB951; --odo: #0B0C0E;
      --man-c: #1E5234; --on-man-c: #C6EFD3; --warn-c: #5A3F00; --on-warn-c: #FFDDAA; --bad-c: #8C0009; --on-bad-c: #FFDAD6;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Roboto, sans-serif;
    background: var(--surface); color: var(--on-surface); font-size: 16px; line-height: 1.5;
    display: flex; flex-direction: column; height: 100dvh;
  }
  button { font: inherit; color: inherit; }
  .i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .i.s { width: 16px; height: 16px; stroke-width: 2.4; vertical-align: -3px; }

  /* ===== トップバー ===== */
  header { height: calc(var(--hdr) + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 8px 0 20px; flex: none; display: flex; align-items: center; gap: 8px; }
  .who-wrap { flex: 1; min-width: 0; }
  .who { display: inline-flex; align-items: center; max-width: 100%; height: 40px; padding: 0 16px; border-radius: 20px;
    background: var(--primary-container); color: var(--on-primary-container); font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who:empty { display: none; }
  /* 撮影／記録：どこを押しても切り替わるスイッチ */
  .psw { position: relative; flex: none; width: 148px; height: 44px; border: 0; border-radius: 22px; background: var(--surface-ch); padding: 4px; display: grid; grid-template-columns: 1fr 1fr; cursor: pointer; touch-action: manipulation; }
  .psw .knob { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); background: var(--primary); border-radius: 18px; transition: transform .35s var(--spring); }
  .psw[aria-checked="true"] .knob { transform: translateX(100%); }
  .psw span { position: relative; z-index: 1; display: grid; place-items: center; font-size: 15px; font-weight: 700; color: var(--on-surface-v); pointer-events: none; transition: color .2s; }
  .psw[aria-checked="false"] span:first-of-type, .psw[aria-checked="true"] span:last-of-type { color: var(--on-primary); }
  .ib { width: 48px; height: 48px; border: 0; background: transparent; border-radius: 999px; display: grid; place-items: center; color: var(--on-surface-v); }
  .ib:active { background: var(--surface-ch); }
  .ib.spin .i { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== スナックバー（重ねずに差し込む） ===== */
  .snack { flex: none; margin: 0 12px 8px; display: none; align-items: center; gap: 4px; min-height: 56px;
    background: var(--inverse); color: var(--on-inverse); border-radius: 16px; padding: 6px 4px 6px 16px; font-size: 14px; touch-action: pan-y; transition: transform .2s, opacity .2s; }
  .snack.show { display: flex; animation: sin .28s var(--spring); }
  @keyframes sin { from { opacity: 0; transform: translateY(-10px) scale(.98); } }
  .snack.drag { transition: none; }
  .snack.err { background: var(--error); color: #fff; }
  .snack .msg { flex: 1; min-width: 0; }
  .snack .msg b { display: block; font-size: 15px; font-weight: 600; }
  .snack .acts { display: flex; flex-wrap: wrap; justify-content: flex-end; }
  .snack .acts button { border: 0; background: transparent; color: var(--inverse-primary); font-weight: 700; font-size: 14px; height: 44px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
  .snack.err .acts button { color: #fff; }
  .snack .x { color: inherit; opacity: .8; }

  /* ===== 左右スワイプのページ ===== */
  .pager { flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
  .pager::-webkit-scrollbar { display: none; }
  .page { flex: none; width: 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow-y: auto; overscroll-behavior-y: contain; }

  /* ===== 撮影 ===== */
  #page-shoot { display: flex; flex-direction: column; }
  .top { padding: 4px 16px 8px; }
  .date { font-size: 14px; color: var(--on-surface-v); margin: 0 4px 12px; }
  .slot { margin-bottom: 16px; }
  .slot-h { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 8px; }
  .slot-n { font-size: 24px; font-weight: 700; letter-spacing: .02em; }
  .chip { font-size: 13px; font-weight: 600; height: 28px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; background: var(--surface-ch); color: var(--on-surface-v); }
  .chip.ok { background: var(--primary-container); color: var(--on-primary-container); }
  .chip.man { background: color-mix(in srgb, var(--manual) 16%, var(--surface)); color: var(--manual); }
  .chip.warn { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); color: var(--warn); }
  .chip.bad { background: color-mix(in srgb, var(--error) 14%, var(--surface)); color: var(--error); }
  .odo { display: flex; align-items: center; gap: 4px; background: var(--odo); padding: 8px 6px 8px 12px; border-radius: 20px; }
  .odo .d { flex: 1; max-width: 38px; height: 46px; display: grid; place-items: center; background: #15171A; color: #F2F4F5; border-radius: 6px;
    font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; box-shadow: inset 0 -10px 12px rgba(255,255,255,.04), inset 0 8px 10px rgba(0,0,0,.5); }
  .odo .d.blank { color: #3A3E44; }
  .odo.man .d:not(.blank) { color: #7FE3A5; }
  .odo.bad .d:not(.blank) { color: #FF8A80; }
  .odo .u { color: #8A919A; font-size: 13px; margin-left: 4px; }
  .edit { margin-left: auto; width: 48px; height: 48px; border: 0; border-radius: 14px; background: transparent; color: #C9CED6; display: grid; place-items: center; flex: none; transition: background .2s, border-radius .3s var(--spring); }
  .edit:active { background: #33373D; border-radius: 10px; }
  .dist { display: flex; justify-content: flex-end; align-items: baseline; gap: 6px; color: var(--on-surface-v); font-size: 14px; margin: 0 4px; }
  .dist b { color: var(--on-surface); font-size: 22px; font-variant-numeric: tabular-nums; }
  .dist.bad b { color: var(--error); }

  .bottom { margin-top: auto; padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
  .hint { margin: 0; text-align: center; font-size: 13px; color: var(--on-surface-v); }
  /* 撮影ボタン：M3E の XL ボタン。押すと角が変形する */
  .shoot { height: 136px; border-radius: 68px; background: var(--primary); color: var(--on-primary);
    display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 30px; font-weight: 700; letter-spacing: .04em;
    cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; transition: border-radius .35s var(--spring), transform .35s var(--spring); }
  .shoot:active { border-radius: 36px; transform: scale(.985); }
  .shoot.busy { opacity: .55; pointer-events: none; }
  .shoot .i { width: 44px; height: 44px; stroke-width: 1.8; }
  /* 出発／帰宅：どこを押しても切り替わるボタングループ */
  .sw { position: relative; height: 80px; border: 0; border-radius: 40px; background: var(--surface-ch); padding: 6px; display: grid; grid-template-columns: 1fr 1fr; cursor: pointer; touch-action: manipulation; }
  .sw .knob { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc(50% - 6px); background: var(--primary-container); border-radius: 34px; transition: transform .38s var(--spring); }
  .sw[aria-checked="true"] .knob { transform: translateX(100%); }
  .sw span { position: relative; z-index: 1; display: grid; place-items: center; font-size: 26px; font-weight: 700; letter-spacing: .08em; color: var(--on-surface-v); pointer-events: none; transition: color .2s; }
  .sw[aria-checked="false"] span:first-of-type, .sw[aria-checked="true"] span:last-of-type { color: var(--on-primary-container); }

  /* ===== 記録 ===== */
  #page-list { padding: 4px 16px calc(24px + env(safe-area-inset-bottom)); }
  .total { background: var(--surface-c); border-radius: 28px; padding: 16px 8px 18px; margin: 0 0 12px; }
  .total .p { font-size: 13px; color: var(--on-surface-v); text-align: center; margin-bottom: 6px; }
  .total .v { display: flex; justify-content: space-evenly; align-items: baseline; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .total .v .sl { color: var(--outline-v); font-weight: 300; }
  .total .v small { font-size: 14px; font-weight: 600; margin-left: 2px; color: var(--on-surface-v); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--on-surface-v); margin: 0 4px 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { font-size: 12px; color: var(--on-surface-v); font-weight: 500; text-align: right; padding: 6px; }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 0; border-top: 1px solid var(--outline-v); text-align: right; }
  tr.today td:first-child .c { color: var(--primary); font-weight: 700; }
  tr.future td { opacity: .38; }
  td .c { display: flex; align-items: center; justify-content: flex-end; gap: 3px; padding: 12px 6px; font-size: 15px; min-height: 48px; }
  td:first-child .c { justify-content: flex-start; }
  td button.c { width: 100%; border: 0; background: none; }
  td button.c:disabled { color: inherit; }
  /* 状態は数字の色ではなく「背景」で示す（見やすさ優先） */
  .c .v { display: inline-flex; align-items: center; gap: 3px; padding: 4px 10px; border-radius: 10px; }
  .c.man .v { background: var(--man-c); color: var(--on-man-c); font-weight: 600; }
  .c.warn .v { background: var(--warn-c); color: var(--on-warn-c); font-weight: 700; }
  .c.bad .v { background: var(--bad-c); color: var(--on-bad-c); font-weight: 700; }
  .c.none { color: var(--on-surface-v); }
  .c.ok .i { color: var(--primary); }
  .sw-c { display: inline-block; width: 14px; height: 14px; border-radius: 4px; }

  /* ===== ボトムシート ===== */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; z-index: 30; }
  .sheet-bg.show { display: flex; }
  .sheet { width: 100%; background: var(--surface-c); border-radius: 28px 28px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 92dvh; overflow-y: auto; animation: up .32s var(--spring); }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } }
  .handle { width: 32px; height: 4px; border-radius: 2px; background: var(--outline-v); margin: 6px auto 14px; }
  .sheet h2 { font-size: 22px; margin: 0 4px 12px; display: flex; justify-content: space-between; align-items: center; }
  .photo { width: 100%; min-height: 120px; max-height: 40dvh; background: var(--surface-ch); border-radius: 20px; display: grid; place-items: center; color: var(--on-surface-v); font-size: 14px; overflow: hidden; }
  .photo img { width: 100%; max-height: 40dvh; object-fit: contain; display: block; }
  .field { margin: 14px 0; }
  .field input { width: 100%; font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 12px 16px; border: 2px solid var(--outline-v); border-radius: 16px; background: var(--surface); color: var(--on-surface); }
  .field input:focus { outline: none; border-color: var(--primary); }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .btn { flex: 1; height: 56px; border-radius: 28px; border: 0; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: border-radius .3s var(--spring); }
  .btn:active { border-radius: 14px; }
  .btn.pri { background: var(--primary); color: var(--on-primary); }
  .btn.ton { background: var(--primary-container); color: var(--on-primary-container); }
  .btn.sec { background: var(--surface-ch); color: var(--on-surface); }
  .btn:disabled { opacity: .4; }

  /* ロード画面（M3 の円形プログレス） */
  .loading { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: rgba(0,0,0,.32); }
  .loading.show { display: grid; animation: fin .15s ease-out; }
  @keyframes fin { from { opacity: 0; } }
  .load-card { min-width: 200px; max-width: 280px; background: var(--surface-c); border-radius: 28px; padding: 28px 24px 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .spinner { width: 48px; height: 48px; animation: rot 1.4s linear infinite; }
  .spinner circle { fill: none; stroke: var(--primary); stroke-width: 4.5; stroke-linecap: round; stroke-dasharray: 90 150; stroke-dashoffset: 0; animation: dash 1.4s ease-in-out infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  @keyframes dash { 0% { stroke-dasharray: 1 150; stroke-dashoffset: 0; } 50% { stroke-dasharray: 90 150; stroke-dashoffset: -35; } 100% { stroke-dasharray: 90 150; stroke-dashoffset: -124; } }
  .load-msg { font-size: 17px; font-weight: 700; }
  .load-sub { font-size: 13px; color: var(--on-surface-v); }
  .load-sub:empty { display: none; }
  .photo .spinner { width: 36px; height: 36px; }
  .reg { position: fixed; inset: 0; background: var(--surface); z-index: 25; padding: 88px 20px 24px; }
  .reg h1 { font-size: 28px; margin: 0 0 20px; }
  .skel { border-radius: 20px; background: linear-gradient(90deg, var(--surface-c), var(--surface-ch), var(--surface-c)); background-size: 200% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
  .debug { position: fixed; left: 8px; right: 8px; bottom: 240px; background: rgba(0,0,0,.8); color: #9fe; font: 11px ui-monospace, Menlo, monospace; white-space: pre-wrap; padding: 8px; border-radius: 8px; max-height: 30dvh; overflow-y: auto; pointer-events: none; z-index: 40; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } .spinner { animation: rot 2s linear infinite !important; } }
</style>
</head>
<body>
<!-- アイコン（iOS純正のようなシンプルな線画） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3.5 8.5A2 2 0 0 1 5.5 6.5h2l1.5-2.2h6l1.5 2.2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6"/></symbol>
  <symbol id="i-reload" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4v4.5H15"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14 7.5l2.5 2.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4"/><path d="M12 17.2v.3"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h15l-3.5-3.5"/><path d="M20 16H5l3.5 3.5"/></symbol>
</svg>

<header>
  <div class="who-wrap"><span class="who" id="who"></span></div>
  <button class="psw" id="psw" role="switch" aria-checked="false" aria-label="撮影と記録の切り替え">
    <i class="knob"></i><span>撮影</span><span>記録</span>
  </button>
  <button class="ib" id="reload" aria-label="更新"><svg class="i"><use href="#i-reload"/></svg></button>
</header>

<div class="snack" id="snack" role="status" aria-live="polite">
  <div class="msg" id="snackMsg"></div>
  <div class="acts" id="snackActs"></div>
  <button class="ib x" id="snackX" aria-label="閉じる"><svg class="i"><use href="#i-close"/></svg></button>
</div>

<div class="pager" id="pager">
  <section class="page" id="page-shoot" aria-label="撮影">
    <div class="top">
      <div class="date" id="today">&nbsp;</div>
      <div id="slots"><div class="skel" style="height:104px"></div><div class="skel" style="height:104px;margin-top:16px"></div></div>
    </div>
    <div class="bottom">
      <p class="hint">保存完了が出たら、画面を閉じて大丈夫です</p>
      <label class="shoot" id="shoot">
        <svg class="i"><use href="#i-camera"/></svg><span id="shootLabel">撮影</span>
        <input id="cam" type="file" accept="image/*" capture="environment" hidden>
      </label>
      <button class="sw" id="sw" role="switch" aria-checked="false" aria-label="出発と帰宅の切り替え">
        <i class="knob"></i><span>出発</span><span>帰宅</span>
      </button>
    </div>
  </section>

  <section class="page" id="page-list" aria-label="記録">
    <div class="total" id="total"><div class="p">&nbsp;</div><div class="skel" style="height:32px;margin:0 16px"></div></div>
    <div class="legend">
      <span><i class="sw-c" style="background:var(--man-c)"></i>手入力</span>
      <span><i class="sw-c" style="background:var(--warn-c)"></i>要確認</span>
      <span><i class="sw-c" style="background:var(--bad-c)"></i>異常値</span>
      <span style="color:var(--primary)"><svg class="i s"><use href="#i-check"/></svg><span style="color:var(--on-surface-v)">確認済み</span></span>
    </div>
    <table>
      <thead><tr><th>日付</th><th>出発</th><th>帰宅</th><th>距離</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</div>

<section class="reg" id="reg" hidden>
  <h1>社員番号</h1>
  <div class="field"><input id="empId" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="000000" aria-label="社員番号（6桁）"></div>
  <button class="btn pri" id="regBtn" style="width:100%">登録</button>
</section>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="handle"></div>
    <h2><span id="sheetTitle"></span><span class="chip" id="sheetTag"></span></h2>
    <div class="photo" id="sheetPhoto">写真なし</div>
    <div class="field"><input id="sheetKm" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="距離計（km）" placeholder="km"></div>
    <div class="row">
      <button class="btn ton" id="sheetConfirm"><svg class="i"><use href="#i-check"/></svg>確認済み</button>
      <button class="btn sec" id="sheetSwap"><svg class="i"><use href="#i-swap"/></svg>出発・帰宅</button>
    </div>
    <div class="row">
      <button class="btn sec" id="sheetCancel">閉じる</button>
      <button class="btn pri" id="sheetSave">保存</button>
    </div>
  </div>
</div>

<div class="loading" id="loading" role="alert" aria-live="assertive" aria-busy="true">
  <div class="load-card">
    <svg class="spinner" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="19"/></svg>
    <div class="load-msg" id="loadingMsg">保存中…</div>
    <div class="load-sub" id="loadingSub"></div>
  </div>
</div>

<canvas id="canvas" hidden></canvas>
<div class="debug" id="debug" hidden></div>

<script>
/* ===== 設定 ===== */
const LIFF_ID = '2011171675-iQ6TuVBt';
const GAS_URL = 'https://script.google.com/macros/s/AKfycby_wWHyTDQs3FDwBQKTtLPie91Goe2DrSHnUslWPpDTz9qKYBM0Ka7o4Y1mcIflX3LWqg/exec';
const MAX_EDGE = 1280;
const JPEG_Q = 0.8;
const DIRECT_UPLOAD = true;
const SWITCH_HOUR = 13;      // この時刻より前は「出発」、以降は「帰宅」を初期選択
const MAX_DAY_KM = 200;      // 1日の距離がこれを超えたら異常値

const LABEL = { 8: '出発', 9: '帰宅' };
const $ = (id) => document.getElementById(id);
const ic = (name, cls) => '<svg class="i' + (cls ? ' ' + cls : '') + '"><use href="#i-' + name + '"/></svg>';
const state = { status: null, list: null, sessions: {}, col: 8, userPicked: false, listLoaded: false };
const DEBUG = /debug(=|%3D)1/.test(location.search);
function dbg(m) { if (!DEBUG) return; $('debug').hidden = false; $('debug').textContent += Math.round(performance.now()) + 'ms ' + m + '\n'; }
function buzz() { try { navigator.vibrate && navigator.vibrate(8); } catch (_) {} }
setCol(new Date().getHours() < SWITCH_HOUR ? 8 : 9, false);
dbg('画面表示（ボタン操作可）');

/* ===== LIFF（表示後に読み込み） ===== */
const ready = new Promise((resolve, reject) => {
  const start = () => {
    const sc = document.createElement('script');
    sc.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
    sc.onload = async () => {
      try {
        await liff.init({ liffId: LIFF_ID });
        dbg('LIFF初期化完了');
        if (!liff.isLoggedIn()) { liff.login(); return; }
        resolve(liff.getIDToken());
      } catch (e) { reject(e); }
    };
    sc.onerror = () => reject(new Error('LINEの読み込みに失敗しました'));
    document.head.appendChild(sc);
  };
  if (document.readyState === 'complete') start(); else window.addEventListener('load', start);
});

async function api(action, data = {}) {
  const idToken = await ready;
  if (!idToken) throw new Error('LINEのIDトークンを取得できません（LIFFのScopeで openid をオン）');
  let res;
  try { res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action, idToken, ...data }) }); }
  catch (e) { throw new Error('接続できません（' + e.message + '）'); }
  const text = await res.text();
  let j;
  try { j = JSON.parse(text); } catch (_) { throw new Error('サーバーの応答が不正です（HTTP ' + res.status + '）'); }
  if (!j.ok) {
    if (/有効期限/.test(j.error) && !sessionStorage.getItem('relogin')) { sessionStorage.setItem('relogin', '1'); location.reload(); }
    throw new Error(j.error || '通信エラー');
  }
  sessionStorage.removeItem('relogin');
  return j;
}
function fire(action, data = {}) {
  return ready.then((idToken) => fetch(GAS_URL, { method: 'POST', keepalive: true, body: JSON.stringify({ action, idToken, ...data }) })
    .then((r) => r.json()).catch(() => null));
}
const directEnabled = () => DIRECT_UPLOAD && localStorage.getItem('noDirect') !== '1';

/* ===== 起動 ===== */
refreshStatus().then(flushOutbox);

async function refreshStatus() {
  try {
    const s = await api('status', { direct: directEnabled(), origin: location.origin });
    dbg('status完了（サーバー ' + s.serverMs + 'ms）');
    state.status = s;
    state.sessions = s.uploads || {};
    if (!s.registered) { $('reg').hidden = false; return; }
    $('reg').hidden = true;
    if (!state.userPicked) setCol(defaultCol(), false);
    render();
  } catch (e) { snack(esc(e.message), 'err'); }
}

function defaultCol() {
  let c = new Date().getHours() < SWITCH_HOUR ? 8 : 9;
  const s = state.status;
  if (s && s.slots) {
    const me = s.slots.find((x) => x.col === c), other = s.slots.find((x) => x.col !== c);
    if (me.saved && !other.saved) c = other.col;
  }
  return c;
}

/* ===== 今日の記録 ===== */
function render() {
  const s = state.status;
  $('who').textContent = s.name;
  $('today').textContent = s.dateLabel;
  const [dep, ret] = s.slots;
  const dist = dep.km !== null && ret.km !== null ? ret.km - dep.km : null;
  const bad = dist !== null && (dist < 0 || dist > MAX_DAY_KM);
  $('slots').innerHTML = slotHtml(dep, bad) + slotHtml(ret, bad) +
    (dist !== null ? '<div class="dist' + (bad ? ' bad' : '') + '">本日<b>' + fmt(dist) + '</b>km</div>' : '');
}
function slotChip(sl, bad) {
  if (sl.km !== null) {
    if (bad) return ['bad', ic('warn', 's') + '異常値'];
    if (sl.warn) return ['warn', ic('warn', 's') + '要確認'];
    if (sl.manual) return ['man', '手入力'];
    if (sl.confirmed) return ['ok', ic('check', 's') + '確認済み'];
    return ['', '記録済み'];
  }
  if (sl.saved) return sl.warn ? ['warn', ic('warn', 's') + '未読取'] : ['', '読み取り中'];
  return ['', '未撮影'];
}
function slotHtml(sl, bad) {
  const [cls, text] = slotChip(sl, bad);
  const digits = sl.km === null ? '------' : String(sl.km).padStart(6, '0');
  const lead = sl.km === null ? 0 : Math.max(0, 6 - String(sl.km).length);
  const odoCls = sl.km === null ? '' : bad ? ' bad' : sl.manual ? ' man' : '';
  return '<div class="slot"><div class="slot-h"><span class="slot-n">' + sl.label + '</span><span class="chip ' + cls + '">' + text + '</span></div>' +
    '<div class="odo' + odoCls + '" aria-label="' + (sl.km === null ? '未記録' : sl.km + 'キロ') + '">' +
    [...digits].map((d, i) => '<span class="d' + (i < lead || sl.km === null ? ' blank' : '') + '">' + (sl.km === null ? '–' : d) + '</span>').join('') +
    '<span class="u">km</span>' +
    '<button class="edit" data-col="' + sl.col + '" aria-label="' + sl.label + 'を編集">' + ic('pencil') + '</button></div></div>';
}
$('slots').addEventListener('click', (e) => {
  const b = e.target.closest('.edit');
  if (!b || !state.status) return;
  const s = state.status, sl = s.slots.find((x) => x.col === Number(b.dataset.col));
  openEditor({ ...sl, dateKey: s.dateKey, label: s.dateLabel });
});

/* ===== 出発／帰宅スイッチ ===== */
function setCol(c, byUser) {
  state.col = c;
  if (byUser) state.userPicked = true;
  $('sw').setAttribute('aria-checked', String(c === 9));
  $('shootLabel').textContent = LABEL[c] + 'を撮影';
}
$('sw').addEventListener('click', () => { buzz(); setCol(state.col === 8 ? 9 : 8, true); });

/* ===== 撮影 → 送信 ===== */
$('cam').addEventListener('change', async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  const takenAt = Date.now(), col = state.col, t0 = performance.now();
  $('shoot').classList.add('busy');
  showLoading('送信中…', LABEL[col] + '　途中で閉じても、次に開いたとき自動で送ります');
  const done = () => { $('shoot').classList.remove('busy'); hideLoading(); };

  const [hash, blob] = await Promise.all([fileHash(file).catch(() => ''), shrink(file).catch(() => null)]);
  if (!blob) { done(); return snack('写真を読み込めませんでした', 'err'); }
  if (hash && sentHashes().includes(hash)) { done(); return snack('<b>送信済みの写真です</b>同じ写真は保存しません', 'err'); }
  const t1 = performance.now();

  const sess = state.sessions[col] && state.sessions[col].expiresAt > Date.now() + 30000 ? state.sessions[col] : null;
  const cid = sess ? sess.cid : uuid();
  let localId = null;
  try { localId = await outbox.add({ buf: await blob.arrayBuffer(), takenAt, cid, col, hash }); } catch (_) {}

  let r = null, route = '';
  if (sess && directEnabled()) {
    try {
      const res = await fetch(sess.url, { method: 'PUT', headers: { 'Content-Type': 'image/jpeg' }, body: blob });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      r = { fileId: j.id, name: j.name || sess.name, col };
      route = '直接';
    } catch (e) { dbg('直接アップロード失敗→GAS経由：' + e.message); localStorage.setItem('noDirect', '1'); }
    delete state.sessions[col];
  }
  if (!r) {
    try { r = await api('upload', { image: await toBase64(blob), takenAt, cid, col }); route = 'GAS経由'; }
    catch (e) { done(); return snack('<b>送信できませんでした</b>' + esc(e.message) + (localId ? '<br>次に開いたとき自動で送ります' : ''), 'err', [], 15000); }
  }
  const t2 = performance.now();
  if (localId) outbox.del(localId).catch(() => {});
  if (hash) rememberHash(hash);
  done(); buzz();
  dbg('準備 ' + Math.round(t1 - t0) + 'ms / 送信(' + route + ') ' + Math.round(t2 - t1) + 'ms / ' + Math.round(blob.size / 1024) + 'KB');

  snack('<b>保存完了</b>' + esc(r.name) + '　閉じても大丈夫です', '',
    [{ icon: 'swap', label: LABEL[r.col === 8 ? 9 : 8] + 'に変更', onClick: () => swapFile(r.fileId) }], 6000);
  if (state.status) {
    const sl = state.status.slots.find((x) => x.col === r.col);
    if (sl) Object.assign(sl, { saved: true, km: null, warn: false, manual: false, confirmed: false, fileId: r.fileId });
    render();
  }
  state.userPicked = false;
  setCol(r.col === 8 ? 9 : 8, false);

  fire('process', { fileId: r.fileId }).then((res) => {
    refreshStatus();
    if (state.listLoaded) loadList();
    const x = res && res.ok && res.result;
    if (!x) return;
    if (x.duplicate) return snack('<b>同じ写真が登録済みでした</b>2枚目は保存していません', 'err');
    const d = { dateKey: x.dateKey, col: x.col, km: x.km, fileId: x.fileId, label: dateLabelFromKey(x.dateKey), warn: x.warnings.length > 0 };
    if (x.km === null) return snack('<b>読み取れませんでした</b>' + LABEL[x.col], 'err', [{ icon: 'pencil', label: '入力', onClick: () => openEditor(d) }], 15000);
    snack('<b>' + LABEL[x.col] + '　' + fmt(x.km) + ' km</b>' + (x.warnings.length ? esc(x.warnings.join(' / ')) : ''), '',
      [{ icon: 'check', label: '正しい', onClick: () => confirmCell(d) }, { icon: 'pencil', label: '修正', onClick: () => openEditor(d) }], 12000);
  });
});

async function swapFile(fileId) {
  try {
    const r = await withLoading('変更中…', () => api('swap', { fileId }));
    buzz(); snack('<b>' + esc(r.name) + ' に変更しました</b>'); syncLater();
  } catch (e) { snack(esc(e.message), 'err'); }
}
async function confirmCell(d) {
  try {
    await withLoading('保存中…', () => api('confirm', { dateKey: d.dateKey, col: d.col }));
    applyLocal(d.dateKey, d.col, { confirmed: true, warn: false });
    buzz(); snack('<b>確認済みにしました</b>'); syncLater();
  } catch (e) { snack(esc(e.message), 'err'); }
}

async function shrink(file) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (_) { src = await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); }); }
  const k = Math.min(1, MAX_EDGE / Math.max(src.width, src.height));
  const c = $('canvas');
  c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  if (src.close) src.close();
  return new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error('toBlob'))), 'image/jpeg', JPEG_Q));
}
async function fileHash(file) {
  if (!crypto.subtle) return '';
  const d = await crypto.subtle.digest('SHA-256', await file.arrayBuffer());
  return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
function sentHashes() { try { return JSON.parse(localStorage.getItem('sentHashes') || '[]'); } catch (_) { return []; } }
function rememberHash(h) { const a = sentHashes().filter((x) => x !== h); a.push(h); localStorage.setItem('sentHashes', JSON.stringify(a.slice(-60))); }
function toBase64(blob) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(blob); }); }
function uuid() { return (crypto.randomUUID && crypto.randomUUID()) || (Date.now().toString(36) + Math.random().toString(36).slice(2)); }

/* ===== 未送信写真の自動再送 ===== */
const outbox = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open('odo-outbox', 2); r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('q')) r.result.createObjectStore('q', { keyPath: 'id', autoIncrement: true }); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async run(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('q', mode); const q = fn(t.objectStore('q')); t.oncomplete = () => res(q.result); t.onerror = () => rej(t.error); }); },
  add(x) { return this.run('readwrite', (s) => s.add(x)); },
  all() { return this.run('readonly', (s) => s.getAll()); },
  del(id) { return this.run('readwrite', (s) => s.delete(id)); },
};
async function flushOutbox() {
  let items = [];
  try { items = await outbox.all(); } catch (_) { return; }
  let sent = 0;
  for (const it of items) {
    try {
      const image = it.image || await toBase64(new Blob([it.buf], { type: 'image/jpeg' }));
      const r = await api('upload', { image, takenAt: it.takenAt, cid: it.cid, col: it.col, retry: true });
      await outbox.del(it.id);
      if (it.hash) rememberHash(it.hash);
      if (!r.duplicate) fire('process', { fileId: r.fileId });
      sent++;
    } catch (_) { break; }
  }
  if (sent) { snack('<b>未送信の写真を ' + sent + ' 件送りました</b>'); refreshStatus(); }
}

/* ===== 記録（期間の最終日＝20日から表示） ===== */
async function loadList() {
  state.listLoaded = true;
  try {
    const d = await api('list');
    d.rows.sort((a, b) => (a.dateKey < b.dateKey ? -1 : 1)); // 21日を一番上、20日を一番下
    state.list = d;
    renderList();
  } catch (e) { snack(esc(e.message), 'err'); }
}
function renderList() {
  const d = state.list;
  {
    markAnomalies(d.rows);
    $('total').innerHTML = '<div class="p">' + esc(d.periodName) + '</div>' +
      '<div class="v"><span>' + fmt(d.total) + '<small>km</small></span><span class="sl">／</span><span>' + fmt(d.yen) + '<small>円</small></span></div>';
    $('rows').innerHTML = d.rows.map((r, i) =>
      '<tr class="' + (r.future ? 'future' : r.today ? 'today' : '') + '"><td><span class="c">' + r.label + '</span></td>' +
      kmCell(r.dep, i, 8, r.future) + kmCell(r.ret, i, 9, r.future) +
      '<td><span class="c' + (r.distBad ? ' bad' : '') + '"><span class="v">' + (r.dist === null ? '' : fmt(r.dist)) + '</span></span></td></tr>').join('');
    if (!state.scrolledToday) {  // 初回は今日の行が見える位置まで送る
      state.scrolledToday = true;
      const t = document.querySelector('#rows tr.today');
      if (t) t.scrollIntoView({ block: 'center' });
    }
  }
}
function markAnomalies(rows) {
  let prev = null;
  rows.forEach((r) => { // 古い日付から順に、前回より小さい値を探す
    ['dep', 'ret'].forEach((k) => { const c = r[k]; if (c.km !== null) { c.bad = prev !== null && c.km < prev; prev = c.km; } });
    r.distBad = r.dist !== null && (r.dist < 0 || r.dist > MAX_DAY_KM);
    if (r.dist !== null && r.dist < 0) { r.dep.bad = true; r.ret.bad = true; }
  });
}
function cellClass(c) { return c.bad ? 'bad' : c.warn ? 'warn' : c.km === null ? 'none' : c.manual ? 'man' : c.confirmed ? 'ok' : ''; }
function kmCell(c, i, col, future) {
  const cls = cellClass(c);
  let html = c.km === null ? (c.warn ? ic('warn', 's') : '—') : fmt(c.km);
  if (cls === 'ok') html += ic('check', 's');
  return '<td><button class="c ' + cls + '" data-i="' + i + '" data-col="' + col + '"' + (future ? ' disabled' : '') + '><span class="v">' + html + '</span></button></td>';
}
$('rows').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-i]');
  if (!b || b.disabled) return;
  const r = state.list.rows[Number(b.dataset.i)], col = Number(b.dataset.col), c = col === 8 ? r.dep : r.ret;
  openEditor({ dateKey: r.dateKey, label: r.label, col, ...c });
});

/* ===== 編集シート ===== */
let editing = null;
const TAG = { bad: [ 'warn', '異常値' ], warn: [ 'warn', '要確認' ], man: [ '', '手入力' ], ok: [ 'check', '確認済み' ], none: [ '', '未入力' ], '': [ '', 'AI読み取り' ] };
async function openEditor(d) {
  editing = d;
  $('sheetTitle').textContent = d.label + '　' + LABEL[d.col];
  const cls = cellClass(d), t = TAG[cls] || TAG[''];
  const tag = $('sheetTag');
  tag.className = 'chip ' + cls;
  tag.innerHTML = (t[0] ? ic(t[0], 's') : '') + t[1];
  $('sheetKm').value = d.km === null || d.km === undefined ? '' : d.km;
  $('sheetConfirm').disabled = d.km === null || d.km === undefined || !!d.confirmed;
  if (d.fileId) $('sheetPhoto').innerHTML = '<svg class="spinner" viewBox="0 0 48 48" aria-label="読み込み中"><circle cx="24" cy="24" r="19"/></svg>';
  else $('sheetPhoto').textContent = '写真なし';
  $('sheetBg').classList.add('show');
  if (d.fileId) {
    try { const p = await api('photo', { fileId: d.fileId }); if (editing === d) $('sheetPhoto').innerHTML = '<img alt="' + esc(p.name) + '" src="data:image/jpeg;base64,' + p.image + '">'; }
    catch (e) { $('sheetPhoto').textContent = e.message; }
  }
}
function closeSheet() { $('sheetBg').classList.remove('show'); editing = null; }
$('sheetCancel').addEventListener('click', closeSheet);
$('sheetBg').addEventListener('click', (e) => { if (e.target === $('sheetBg')) closeSheet(); });
$('sheetSave').addEventListener('click', async () => {
  const km = Number(toHalf($('sheetKm').value).replace(/[^\d]/g, ''));
  if (!editing || !km) return snack('距離計の数値を入力してください', 'err');
  const d = editing;
  try {
    const r = await withLoading('保存中…', () => api('correct', { dateKey: d.dateKey, col: d.col, km }));
    r.warnings = r.warnings || [];
    closeSheet(); buzz();
    applyLocal(d.dateKey, d.col, { km, manual: true, confirmed: false, warn: r.warnings.length > 0 });
    snack('<b>保存しました</b>' + (r.warnings.length ? esc(r.warnings.join(' / ')) : ''));
    syncLater();
  } catch (e) { snack(esc(e.message), 'err'); }
});
$('sheetConfirm').addEventListener('click', async () => { const d = editing; closeSheet(); await confirmCell(d); });
$('sheetSwap').addEventListener('click', async () => {
  const d = editing; closeSheet();
  try {
    await withLoading('入れ替え中…', () => api('swapDay', { dateKey: d.dateKey }));
    applyLocal(d.dateKey, 'swap');
    buzz(); snack('<b>' + d.label + ' の出発と帰宅を入れ替えました</b>'); syncLater();
  } catch (e) { snack(esc(e.message), 'err'); }
});

/* ===== 初回登録 ===== */
$('regBtn').addEventListener('click', async () => {
  try {
    const s = await withLoading('登録中…', () => api('register', { empId: toHalf($('empId').value), direct: directEnabled(), origin: location.origin }));
    state.status = s; state.sessions = s.uploads || {};
    $('reg').hidden = true; setCol(defaultCol(), false); render();
    snack('<b>' + esc(s.name) + ' さんで登録しました</b>');
  } catch (e) { snack(esc(e.message), 'err'); }
});

/* ===== 左右スワイプでページ切り替え ===== */
const pager = $('pager');
let pageIdx = 0;
function goPage(i) { pager.scrollTo({ left: i * pager.clientWidth, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
let progScroll = null; // スイッチで動かしている最中はスクロール位置による切り替えを無視（ちらつき防止）
$('psw').addEventListener('click', () => {
  buzz();
  const i = pageIdx === 0 ? 1 : 0;
  setPage(i);
  clearTimeout(progScroll);
  progScroll = setTimeout(() => { progScroll = null; }, 600);
  goPage(i);
});
function setPage(i) {
  pageIdx = i;
  $('psw').setAttribute('aria-checked', String(i === 1));
  if (i === 1 && !state.listLoaded) loadList();
}
pager.addEventListener('scroll', () => {
  const i = Math.round(pager.scrollLeft / Math.max(1, pager.clientWidth));
  if (progScroll) return;
  if (i !== pageIdx) setPage(i);
}, { passive: true });
window.addEventListener('resize', () => pager.scrollTo({ left: pageIdx * pager.clientWidth }));

/* ===== 更新 ===== */
$('reload').addEventListener('click', async () => {
  const b = $('reload');
  if (b.classList.contains('spin')) return;
  b.classList.add('spin');
  await Promise.all([refreshStatus(), state.listLoaded || pageIdx === 1 ? loadList() : null, flushOutbox()]);
  b.classList.remove('spin');
});

/* ===== スナックバー（スワイプか×で消える） ===== */
let snackTimer = null;
function snack(html, kind, actions, ms) {
  const t = $('snack');
  $('snackMsg').innerHTML = html;
  t.className = 'snack show ' + (kind || '');
  t.style.transform = ''; t.style.opacity = '';
  const box = $('snackActs');
  box.innerHTML = '';
  (actions || []).forEach((a) => {
    const b = document.createElement('button');
    b.innerHTML = (a.icon ? ic(a.icon, 's') : '') + esc(a.label);
    b.onclick = () => { hideSnack(); a.onClick(); };
    box.appendChild(b);
  });
  clearTimeout(snackTimer);
  if (kind !== '' || actions) snackTimer = setTimeout(hideSnack, ms || (kind === 'err' ? 12000 : 4000));
}
function hideSnack() { const t = $('snack'); t.classList.remove('show', 'drag'); t.style.transform = ''; t.style.opacity = ''; }
$('snackX').addEventListener('click', hideSnack);
(() => {
  const t = $('snack');
  let sx = 0, sy = 0, dx = 0, dy = 0, on = false;
  t.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) return; on = true; sx = e.clientX; sy = e.clientY; dx = dy = 0; t.classList.add('drag'); clearTimeout(snackTimer); });
  window.addEventListener('pointermove', (e) => {
    if (!on) return;
    dx = e.clientX - sx; dy = Math.min(0, e.clientY - sy);
    t.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    t.style.opacity = String(Math.max(.2, 1 - (Math.abs(dx) + Math.abs(dy)) / 220));
  });
  window.addEventListener('pointerup', () => {
    if (!on) return;
    on = false; t.classList.remove('drag');
    if (Math.abs(dx) > 70 || dy < -35) {
      t.style.transform = 'translate(' + (dx === 0 ? 0 : Math.sign(dx) * 480) + 'px,' + (dy < -35 ? -120 : 0) + 'px)'; t.style.opacity = '0';
      setTimeout(hideSnack, 180);
    } else { t.style.transform = ''; t.style.opacity = ''; snackTimer = setTimeout(hideSnack, 5000); }
  });
})();

/* ===== ロード画面 ===== */
let loadCount = 0;
function showLoading(msg, sub) { loadCount++; $('loadingMsg').textContent = msg || '保存中…'; $('loadingSub').textContent = sub || ''; $('loading').classList.add('show'); }
function hideLoading() { loadCount = Math.max(0, loadCount - 1); if (!loadCount) $('loading').classList.remove('show'); }
async function withLoading(msg, fn, sub) { showLoading(msg, sub); try { return await fn(); } finally { hideLoading(); } }

/* ===== 保存後はサーバーを待たずに手元の表示を更新（その後、裏で最新化） ===== */
function applyLocal(dateKey, col, patch) {
  if (state.list) {
    const r = state.list.rows.find((x) => x.dateKey === dateKey);
    if (r) {
      if (col === 'swap') { const t = r.dep; r.dep = r.ret; r.ret = t; } else Object.assign(col === 8 ? r.dep : r.ret, patch);
      r.dist = r.dep.km !== null && r.dep.km !== undefined && r.ret.km !== null && r.ret.km !== undefined ? r.ret.km - r.dep.km : null;
      state.list.total = state.list.rows.reduce((a, x) => a + (x.dist || 0), 0);
      state.list.yen = Math.round(state.list.total * (state.list.rate || 0));
      renderList();
    }
  }
  const s = state.status;
  if (s && s.dateKey === dateKey) {
    if (col === 'swap') { const [a, b] = s.slots; s.slots = [{ ...b, col: 8, label: '出発' }, { ...a, col: 9, label: '帰宅' }]; }
    else Object.assign(s.slots.find((x) => x.col === col), patch);
    render();
  }
}
function syncLater() { setTimeout(() => { refreshStatus(); if (state.listLoaded) loadList(); }, 400); }

/* ===== 共通 ===== */
function dateLabelFromKey(k) { const [y, m, d] = k.split('-').map(Number); return m + '/' + d + '(' + '日月火水木金土'[new Date(y, m - 1, d).getDay()] + ')'; }
function fmt(n) { return Math.round(n).toLocaleString('ja-JP'); }
function toHalf(s) { return String(s).replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
