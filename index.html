<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>交通費メーター</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://api.line.me">
<script async id="liffsdk" src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<style>
  :root {
    --sign: #1E4E9C; --asphalt: #2B2F33; --paper: #F6F7F8; --line: #DDE1E5;
    --ink: #1C1F22; --sub: #5E666E; --ok: #2F8F5B; --warn: #C98A0B; --err: #C0392B; --card: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #15181B; --card: #1F2327; --line: #30363B; --ink: #ECEFF1; --sub: #9AA3AB; --asphalt: #0E1012; --sign: #4C7FD6; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: var(--paper); color: var(--ink); font-size: 16px; line-height: 1.5;
    display: flex; flex-direction: column;
  }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px; gap: 12px; }
  .who { font-size: 14px; color: var(--sub); }
  .who b { color: var(--ink); font-weight: 600; font-size: 16px; }
  .tabs { display: flex; background: var(--line); border-radius: 999px; padding: 3px; }
  .tabs button { border: 0; background: transparent; color: var(--sub); font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 999px; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); font-weight: 600; }
  main { flex: 1; overflow-y: auto; }

  /* ===== 撮影タブ：画面中央の大きなボタン ===== */
  #view-shoot { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 16px 48px; gap: 22px; }
  .shoot {
    width: min(64vw, 260px); aspect-ratio: 1; border-radius: 50%;
    background: var(--sign); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 0 0 10px color-mix(in srgb, var(--sign) 18%, transparent);
    cursor: pointer; user-select: none;
  }
  .shoot:active { transform: scale(.97); }
  .shoot.busy { opacity: .6; pointer-events: none; }
  .shoot svg { width: 64px; height: 64px; }
  .shoot span { font-size: 22px; font-weight: 700; }
  .today-mini { display: flex; gap: 10px; }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; min-width: 128px; text-align: center; }
  .chip .l { font-size: 12px; color: var(--sub); }
  .chip .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chip.done .v { color: var(--ok); }
  .chip.warn .v { color: var(--warn); }
  .note { font-size: 13px; color: var(--sub); text-align: center; }

  /* ===== 記録タブ ===== */
  #view-list { padding: 4px 16px 40px; }
  .date { font-size: 14px; color: var(--sub); margin: 8px 2px 10px; }
  .slot { margin-bottom: 14px; }
  .slot-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 6px; }
  .slot-name { font-size: 18px; font-weight: 700; }
  .slot-state { font-size: 13px; color: var(--sub); }
  .slot-state.ok { color: var(--ok); }
  .slot-state.warn { color: var(--warn); font-weight: 600; }
  .odo { display: flex; align-items: center; gap: 4px; background: var(--asphalt); padding: 10px 12px; border-radius: 10px; min-height: 68px; }
  .odo .d {
    flex: 1; max-width: 40px; height: 48px; display: grid; place-items: center; background: #111416; color: #F2F4F5; border-radius: 4px;
    font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums;
    box-shadow: inset 0 -10px 12px rgba(255,255,255,.04), inset 0 8px 10px rgba(0,0,0,.5);
  }
  .odo .d.blank { color: #3A4046; }
  .odo .unit { color: #8A939B; font-size: 14px; margin-left: 6px; }
  .dist { text-align: right; font-size: 14px; color: var(--sub); margin: 2px 2px 0; }
  .dist b { color: var(--ink); font-size: 18px; }
  h2.sec { font-size: 15px; margin: 22px 2px 8px; color: var(--sub); font-weight: 600; }
  .total { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; }
  .total .p { font-size: 13px; color: var(--sub); }
  .total .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { font-size: 12px; color: var(--sub); font-weight: 500; text-align: right; padding: 4px 6px; }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 0; border-top: 1px solid var(--line); text-align: right; }
  td .c { display: block; padding: 11px 6px; font-size: 15px; }
  td button.c { width: 100%; border: 0; background: none; font: inherit; color: inherit; text-align: right; }
  td .c.warn { color: var(--warn); font-weight: 700; }
  td .c.none { color: var(--sub); }
  td .c.man::after { content: "手"; font-size: 10px; color: var(--sub); margin-left: 2px; }

  /* ===== トースト ===== */
  .toast {
    position: fixed; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top));
    background: var(--ink); color: var(--paper); border-radius: 14px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px; font-size: 15px;
    transform: translateY(-12px); opacity: 0; pointer-events: none; transition: transform .18s, opacity .18s;
  }
  .toast.show { transform: none; opacity: 1; pointer-events: auto; }
  .toast .msg { flex: 1; }
  .toast .msg b { display: block; font-size: 17px; }
  .toast.ok { background: var(--ok); color: #fff; }
  .toast.err { background: var(--err); color: #fff; }
  .toast button { border: 1px solid rgba(255,255,255,.7); background: transparent; color: inherit; font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; white-space: nowrap; }

  /* ===== 修正シート ===== */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; }
  .sheet-bg.show { display: flex; }
  .sheet { width: 100%; background: var(--card); border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto; }
  .sheet h2 { font-size: 18px; margin: 0 0 10px; }
  .photo { width: 100%; min-height: 120px; background: var(--line); border-radius: 10px; display: grid; place-items: center; color: var(--sub); font-size: 14px; overflow: hidden; }
  .photo img { width: 100%; display: block; }
  .field { margin: 14px 0; }
  .field label { font-size: 13px; color: var(--sub); }
  .field input { width: 100%; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); }
  .field input:focus { outline: none; border-color: var(--sign); }
  .row { display: flex; gap: 10px; }
  .btn { flex: 1; height: 52px; border-radius: 12px; border: 0; font: inherit; font-size: 16px; font-weight: 700; }
  .btn.pri { background: var(--sign); color: #fff; }
  .btn.sec { background: var(--line); color: var(--ink); }

  .reg { padding: 24px 20px; }
  .reg h1 { font-size: 22px; margin: 0 0 6px; }
  .reg p { color: var(--sub); margin: 0 0 18px; font-size: 14px; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--sign); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="who" id="who">読み込み中…</div>
  <div class="tabs" id="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="shoot">撮影</button>
    <button role="tab" aria-selected="false" data-tab="list">記録</button>
  </div>
</header>

<main>
  <!-- 撮影タブ（開いたらすぐ押せる） -->
  <section id="view-shoot">
    <label class="shoot" id="shoot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span id="shootLabel">撮影</span>
      <input id="cam" type="file" accept="image/*" capture="environment" hidden>
    </label>
    <div class="today-mini">
      <div class="chip" id="chipDep"><div class="l">出発</div><div class="v">—</div></div>
      <div class="chip" id="chipRet"><div class="l">帰宅</div><div class="v">—</div></div>
    </div>
    <div class="note">「保存完了」が出たら、すぐ閉じて大丈夫です</div>
  </section>

  <!-- 記録タブ -->
  <section id="view-list" hidden>
    <div class="date" id="today"></div>
    <div id="slots"></div>
    <h2 class="sec">今期の記録</h2>
    <div class="total" id="total"><div class="p">読み込み中…</div></div>
    <table>
      <thead><tr><th>日付</th><th>出発</th><th>帰宅</th><th>距離</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <!-- 初回登録 -->
  <section id="view-reg" class="reg" hidden>
    <h1>社員番号を登録</h1>
    <p>最初の1回だけ必要です。交通費シートの社員番号（6桁）を入力してください。</p>
    <div class="field">
      <label for="empId">社員番号</label>
      <input id="empId" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off">
    </div>
    <button class="btn pri" id="regBtn" style="width:100%">登録する</button>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">
  <div class="msg" id="toastMsg"></div>
  <button id="toastBtn" hidden></button>
</div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle"></h2>
    <div class="photo" id="sheetPhoto">写真なし</div>
    <div class="field">
      <label for="sheetKm">距離計（km）</label>
      <input id="sheetKm" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
    </div>
    <div class="row">
      <button class="btn sec" id="sheetCancel">閉じる</button>
      <button class="btn pri" id="sheetSave">この数値で保存</button>
    </div>
  </div>
</div>

<canvas id="canvas" hidden></canvas>

<script>
/* ===== 設定（デプロイ時に書き換える） ===== */
const LIFF_ID = 'ここにLIFF ID';
const GAS_URL = 'ここにGASウェブアプリのURL（/exec）';
const MAX_EDGE = 1600;   // 送信前に縮小する長辺（px）
const JPEG_Q = 0.85;

const LABEL = { 8: '出発', 9: '帰宅' };
const $ = (id) => document.getElementById(id);
const state = { status: null, list: null };

/* ===== LIFF 初期化（画面表示と並行） ===== */
const ready = (async () => {
  if (!window.liff) await new Promise((res) => $('liffsdk').addEventListener('load', res));
  await liff.init({ liffId: LIFF_ID });
  if (!liff.isLoggedIn()) { liff.login(); return new Promise(() => {}); }
  return liff.getIDToken();
})();

async function api(action, data = {}) {
  const idToken = await ready;
  if (!idToken) throw new Error('LINEのIDトークンを取得できません（LIFF設定のScopeで openid をオンにしてください）');
  let res;
  try {
    // Content-Type を付けない（text/plain）→ CORSプリフライトなし
    res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action, idToken, ...data }) });
  } catch (e) {
    throw new Error('GASに接続できません。GAS_URL（/exec）と、デプロイの「アクセスできるユーザー：全員」を確認してください。（' + e.message + '）');
  }
  const text = await res.text();
  let j;
  try { j = JSON.parse(text); } catch (_) {
    throw new Error('GASの応答が不正です（HTTP ' + res.status + '）：' + text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 150));
  }
  if (!j.ok) throw new Error(j.error || '通信エラー');
  return j;
}
/** 応答を待たずに投げる（画面を閉じても送信は続く） */
function fire(action, data = {}) {
  return ready.then((idToken) => fetch(GAS_URL, {
    method: 'POST', keepalive: true, body: JSON.stringify({ action, idToken, ...data }),
  }).then((r) => r.json()).catch(() => null));
}

/* ===== 起動：撮影している間にサーバー側の準備を済ませる ===== */
refreshStatus().then(flushOutbox);

async function refreshStatus() {
  try {
    const s = await api('status');
    state.status = s;
    if (!s.registered) return showView('reg');
    render();
  } catch (e) { toast(esc(e.message), 'err'); }
}

function render() {
  const s = state.status;
  $('who').innerHTML = '<b>' + esc(s.name) + '</b> さん';
  const [dep, ret] = s.slots;
  chip('chipDep', dep); chip('chipRet', ret);
  const both = dep.saved && ret.saved;
  $('shootLabel').textContent = both ? '帰宅を撮り直す' : LABEL[s.next] + 'を撮影';
  // 記録タブの今日の欄
  $('today').textContent = s.dateLabel + ' の記録';
  $('slots').innerHTML = slotHtml(dep) + slotHtml(ret) +
    (dep.km !== null && ret.km !== null ? '<div class="dist">本日の移動 <b>' + fmt(ret.km - dep.km) + '</b> km</div>' : '');
}
function chip(id, sl) {
  const el = $(id);
  el.className = 'chip' + (sl.km !== null ? (sl.warn ? ' warn' : ' done') : sl.saved ? (sl.warn ? ' warn' : '') : '');
  el.querySelector('.v').textContent = sl.km !== null ? fmt(sl.km) : sl.saved ? (sl.warn ? '要確認' : '読み取り中') : '—';
}
function slotHtml(sl) {
  let stateText = '未撮影', cls = '';
  if (sl.km !== null) { stateText = sl.warn ? '要確認' : '記録済み'; cls = sl.warn ? 'warn' : 'ok'; }
  else if (sl.saved) { stateText = sl.warn ? '読み取れませんでした（下の一覧から入力）' : '保存済み・読み取り中'; cls = sl.warn ? 'warn' : ''; }
  const digits = sl.km === null ? '------' : String(sl.km).padStart(6, '0');
  const lead = sl.km === null ? 0 : Math.max(0, 6 - String(sl.km).length);
  return '<div class="slot"><div class="slot-head"><span class="slot-name">' + sl.label + '</span>' +
    '<span class="slot-state ' + cls + '">' + stateText + '</span></div>' +
    '<div class="odo">' + [...digits].map((d, i) => '<span class="d' + (i < lead || sl.km === null ? ' blank' : '') + '">' + (sl.km === null ? '–' : d) + '</span>').join('') +
    '<span class="unit">km</span></div></div>';
}

/* ===== 撮影 → 縮小 → 保存 → トースト ===== */
$('cam').addEventListener('change', async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  const takenAt = Date.now();
  $('shoot').classList.add('busy');
  toast('<b>保存中…</b>', '');
  let b64;
  try { b64 = await shrink(file); }
  catch (e) { $('shoot').classList.remove('busy'); return toast('写真を読み込めませんでした。もう一度撮影してください。', 'err'); }
  try {
    const r = await api('upload', { image: b64, takenAt });
    toast('<b>保存完了（' + esc(r.name) + '）</b>閉じても大丈夫です', 'ok', { label: r.otherLabel + 'に変更', onClick: () => swap(r.fileId) }, 7000);
    if (state.status) {
      const sl = state.status.slots.find((x) => x.col === r.col);
      if (sl) { sl.saved = true; sl.km = null; sl.warn = false; }
      state.status.next = 9;
      render();
    }
    // AI読み取りを依頼（待たない）。開いたままなら終わり次第表示を更新
    fire('process', { fileId: r.fileId }).then((res) => { if (res && res.ok) refreshStatus(); });
  } catch (e) {
    const queued = await outbox.add({ image: b64, takenAt }).then(() => true).catch(() => false);
    toast('<b>送信できませんでした</b>' + esc(e.message) + (queued ? '<br>写真は端末に保存し、次に開いたとき自動で送ります。' : ''), 'err', null, 15000);
  } finally {
    $('shoot').classList.remove('busy');
  }
});

async function swap(fileId) {
  try {
    const r = await api('swap', { fileId });
    toast('<b>' + esc(r.name) + ' に変更しました</b>', 'ok');
    refreshStatus();
  } catch (e) { toast(esc(e.message), 'err'); }
}

/** 長辺 MAX_EDGE px の JPEG に縮小して base64 を返す */
async function shrink(file) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (_) {
    src = await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); });
  }
  const k = Math.min(1, MAX_EDGE / Math.max(src.width, src.height));
  const c = $('canvas');
  c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  if (src.close) src.close();
  return c.toDataURL('image/jpeg', JPEG_Q).split(',')[1];
}

/* ===== 送れなかった写真を端末に保存し、次回起動時に自動送信 ===== */
const outbox = {
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('odo-outbox', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('q', { keyPath: 'id', autoIncrement: true });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('q', mode); const q = fn(t.objectStore('q'));
      t.oncomplete = () => res(q.result); t.onerror = () => rej(t.error);
    });
  },
  add(x) { return this.run('readwrite', (s) => s.add(x)); },
  all() { return this.run('readonly', (s) => s.getAll()); },
  del(id) { return this.run('readwrite', (s) => s.delete(id)); },
};
async function flushOutbox() {
  let items = [];
  try { items = await outbox.all(); } catch (_) { return; }
  let sent = 0;
  for (const it of items) {
    try {
      const r = await api('upload', { image: it.image, takenAt: it.takenAt });
      await outbox.del(it.id);
      fire('process', { fileId: r.fileId });
      sent++;
    } catch (_) { break; }
  }
  if (sent) { toast('<b>未送信だった写真を ' + sent + ' 件送りました</b>', 'ok'); refreshStatus(); }
}

/* ===== 記録タブ ===== */
async function loadList() {
  try {
    const d = await api('list');
    state.list = d;
    $('total').innerHTML = '<div class="p">' + esc(d.periodName) + ' の合計</div><div class="v">' + fmt(d.total) + ' km ／ ' + fmt(d.yen) + ' 円</div>';
    $('rows').innerHTML = d.rows.map((r, i) =>
      '<tr><td><span class="c">' + r.label + '</span></td>' + kmCell(r.dep, i, 8) + kmCell(r.ret, i, 9) +
      '<td><span class="c">' + (r.dist === null ? '' : fmt(r.dist)) + '</span></td></tr>').join('');
  } catch (e) { toast(esc(e.message), 'err'); }
}
function kmCell(c, i, col) {
  const cls = c.warn ? 'warn' : c.km === null ? 'none' : c.manual ? 'man' : '';
  const text = c.km === null ? (c.warn ? '⚠️' : '—') : (c.warn ? '⚠️' : '') + fmt(c.km);
  return '<td><button class="c ' + cls + '" data-i="' + i + '" data-col="' + col + '">' + text + '</button></td>';
}
$('rows').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-i]');
  if (b) openSheet(state.list.rows[Number(b.dataset.i)], Number(b.dataset.col));
});

let editing = null;
async function openSheet(row, col) {
  const c = col === 8 ? row.dep : row.ret;
  editing = { dateKey: row.dateKey, col };
  $('sheetTitle').textContent = row.label + ' ' + LABEL[col];
  $('sheetKm').value = c.km === null ? '' : c.km;
  $('sheetPhoto').textContent = c.fileId ? '写真を読み込み中…' : '写真なし';
  $('sheetBg').classList.add('show');
  if (c.fileId) {
    try {
      const p = await api('photo', { fileId: c.fileId });
      $('sheetPhoto').innerHTML = '<img alt="' + esc(p.name) + '" src="data:image/jpeg;base64,' + p.image + '">';
    } catch (e) { $('sheetPhoto').textContent = e.message; }
  }
}
function closeSheet() { $('sheetBg').classList.remove('show'); editing = null; }
$('sheetCancel').addEventListener('click', closeSheet);
$('sheetBg').addEventListener('click', (e) => { if (e.target === $('sheetBg')) closeSheet(); });
$('sheetSave').addEventListener('click', async () => {
  const km = Number(toHalf($('sheetKm').value).replace(/[^\d]/g, ''));
  if (!editing || !km) return toast('距離計の数値を入力してください', 'err');
  try {
    const r = await api('correct', { ...editing, km });
    closeSheet();
    toast('<b>保存しました</b>' + (r.warnings.length ? '⚠️ ' + esc(r.warnings.join(' / ')) : ''), r.warnings.length ? '' : 'ok');
    loadList(); refreshStatus();
  } catch (e) { toast(esc(e.message), 'err'); }
});

/* ===== 初回登録 ===== */
$('regBtn').addEventListener('click', async () => {
  try {
    const s = await api('register', { empId: toHalf($('empId').value) });
    state.status = s;
    showView('shoot'); render();
    toast('<b>' + esc(s.name) + ' さんで登録しました</b>', 'ok');
  } catch (e) { toast(esc(e.message), 'err'); }
});

/* ===== 画面切り替え・共通 ===== */
document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => {
  showView(b.dataset.tab);
  if (b.dataset.tab === 'list') loadList();
}));
function showView(name) {
  ['shoot', 'list', 'reg'].forEach((v) => { $('view-' + v).hidden = v !== name; });
  $('tabs').hidden = name === 'reg';
  document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
}

let toastTimer = null;
function toast(html, kind, action, ms) {
  const t = $('toast');
  $('toastMsg').innerHTML = html;
  t.className = 'toast show ' + (kind || '');
  const btn = $('toastBtn');
  if (action) { btn.hidden = false; btn.textContent = action.label; btn.onclick = () => { t.classList.remove('show'); action.onClick(); }; }
  else { btn.hidden = true; btn.onclick = null; }
  clearTimeout(toastTimer);
  if (kind) toastTimer = setTimeout(() => t.classList.remove('show'), ms || (kind === 'err' ? 15000 : 4000));
}
function fmt(n) { return Math.round(n).toLocaleString('ja-JP'); }
function toHalf(s) { return String(s).replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
</script>
