<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>交通費の記録</title>
<!-- GASへの接続を先に張っておく（初回通信の短縮） -->
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://api.line.me">
<script async id="liffsdk" src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<style>
  :root {
    --sign: #1E4E9C;        /* 道路標識の青：操作 */
    --asphalt: #2B2F33;     /* 距離計の文字盤 */
    --paper: #F6F7F8;
    --line: #DDE1E5;
    --ink: #1C1F22;
    --sub: #5E666E;
    --ok: #2F8F5B;
    --warn: #C98A0B;
    --err: #C0392B;
    --card: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #15181B; --card: #1F2327; --line: #30363B; --ink: #ECEFF1; --sub: #9AA3AB; --asphalt: #0E1012; --sign: #4C7FD6; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: var(--paper); color: var(--ink); font-size: 16px; line-height: 1.5;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 8px; gap: 12px;
  }
  .who { font-size: 14px; color: var(--sub); }
  .who b { color: var(--ink); font-weight: 600; font-size: 16px; }
  main { flex: 1; overflow-y: auto; padding: 4px 16px 40px; }
  .date { font-size: 14px; color: var(--sub); margin: 8px 2px 10px; }

  /* 距離計（この画面の主役） */
  .slot { margin-bottom: 14px; }
  h2.sec { font-size: 15px; margin: 22px 2px 0; color: var(--sub); font-weight: 600; }
  .slot-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 6px; }
  .slot-name { font-size: 18px; font-weight: 700; }
  .slot-state { font-size: 13px; color: var(--sub); }
  .slot-state.ok { color: var(--ok); }
  .slot-state.warn { color: var(--warn); font-weight: 600; }
  .odo {
    display: flex; align-items: center; gap: 4px; background: var(--asphalt);
    padding: 10px 12px; border-radius: 10px; min-height: 68px;
  }
  .odo .d {
    flex: 1; max-width: 40px; height: 48px; display: grid; place-items: center;
    background: #111416; color: #F2F4F5; border-radius: 4px;
    font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums;
    box-shadow: inset 0 -10px 12px rgba(255,255,255,.04), inset 0 8px 10px rgba(0,0,0,.5);
  }
  .odo .d.blank { color: #3A4046; }
  .odo .unit { color: #8A939B; font-size: 14px; margin-left: 6px; }
  .odo.waiting .d { color: #5A636B; }
  .dist { text-align: right; font-size: 14px; color: var(--sub); margin: 2px 2px 0; }
  .dist b { color: var(--ink); font-size: 18px; }


  /* トースト */
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom));
    background: var(--ink); color: var(--paper); border-radius: 14px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px; font-size: 15px;
    transform: translateY(20px); opacity: 0; pointer-events: none; transition: transform .18s, opacity .18s;
  }
  .toast.show { transform: none; opacity: 1; pointer-events: auto; }
  .toast .msg { flex: 1; }
  .toast .msg b { display: block; font-size: 17px; }
  .toast.ok { background: var(--ok); color: #fff; }
  .toast.err { background: var(--err); color: #fff; }

  /* 記録一覧 */
  .total { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 8px 0 14px; }
  .total .p { font-size: 13px; color: var(--sub); }
  .total .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { font-size: 12px; color: var(--sub); font-weight: 500; text-align: right; padding: 4px 6px; }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 0; border-top: 1px solid var(--line); text-align: right; }
  td .c { display: block; padding: 11px 6px; font-size: 15px; }
  td button.c { width: 100%; border: 0; background: none; font: inherit; color: inherit; text-align: right; }
  td .c.warn { color: var(--warn); font-weight: 700; }
  td .c.none { color: var(--sub); }
  td .c.man::after { content: "手"; font-size: 10px; color: var(--sub); margin-left: 2px; }

  /* 修正シート */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; }
  .sheet-bg.show { display: flex; }
  .sheet {
    width: 100%; background: var(--card); border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
    max-height: 92vh; overflow-y: auto;
  }
  .sheet h2 { font-size: 18px; margin: 0 0 10px; }
  .photo { width: 100%; min-height: 120px; background: var(--line); border-radius: 10px; display: grid; place-items: center; color: var(--sub); font-size: 14px; overflow: hidden; }
  .photo img { width: 100%; display: block; }
  .field { margin: 14px 0; }
  .field label { font-size: 13px; color: var(--sub); }
  .field input {
    width: 100%; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 10px 12px;
    border: 2px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink);
  }
  .field input:focus { outline: none; border-color: var(--sign); }
  .row { display: flex; gap: 10px; }
  .btn { flex: 1; height: 52px; border-radius: 12px; border: 0; font: inherit; font-size: 16px; font-weight: 700; }
  .btn.pri { background: var(--sign); color: #fff; }
  .btn.sec { background: var(--line); color: var(--ink); }

  /* 初回登録 */
  .reg { padding: 24px 4px; }
  .reg h1 { font-size: 22px; margin: 0 0 6px; }
  .reg p { color: var(--sub); margin: 0 0 18px; font-size: 14px; }

  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--sign); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="who" id="who">読み込み中…</div>
</header>

<main>
  <section id="view-main">
    <div class="date" id="today"></div>
    <div id="slots"></div>
    <div class="total" id="total"><div class="p">読み込み中…</div></div>
    <table>
      <thead><tr><th>日付</th><th>出発</th><th>帰宅</th><th>距離</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <section id="view-reg" class="reg" hidden>
    <h1>社員番号を登録</h1>
    <p>最初の1回だけ必要です。交通費シートの社員番号（6桁）を入力してください。</p>
    <div class="field">
      <label for="empId">社員番号</label>
      <input id="empId" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off">
    </div>
    <button class="btn pri" id="regBtn" style="width:100%">登録する</button>
  </section>
</main>


<div class="toast" id="toast" role="status" aria-live="polite">
  <div class="msg" id="toastMsg"></div>
</div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle"></h2>
    <div class="photo" id="sheetPhoto">写真なし</div>
    <div class="field">
      <label for="sheetKm">距離計（km）</label>
      <input id="sheetKm" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
    </div>
    <div class="row">
      <button class="btn sec" id="sheetCancel">閉じる</button>
      <button class="btn pri" id="sheetSave">この数値で保存</button>
    </div>
  </div>
</div>

<script>
/* ===== 設定（デプロイ時に書き換える） ===== */
const LIFF_ID = 'ここにLIFF ID';
const GAS_URL = 'ここにGASウェブアプリのURL（/exec）';

const LABEL = { 8: '出発', 9: '帰宅' };
const $ = (id) => document.getElementById(id);
const state = { list: null };

/* ===== LIFF 初期化 ===== */
const ready = (async () => {
  if (!window.liff) await new Promise((res) => $('liffsdk').addEventListener('load', res));
  await liff.init({ liffId: LIFF_ID });
  if (!liff.isLoggedIn()) { liff.login(); return new Promise(() => {}); }
  return liff.getIDToken();
})();

async function api(action, data = {}) {
  const idToken = await ready;
  if (!idToken) throw new Error('LINEのIDトークンを取得できません（LIFF設定のScopeで openid をオンにしてください）');
  let res;
  try {
    // Content-Type を付けない（text/plain）→ CORSプリフライトなし
    res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action, idToken, ...data }) });
  } catch (e) {
    throw new Error('GASに接続できません。GAS_URL（/exec）と、デプロイの「アクセスできるユーザー：全員」を確認してください。（' + e.message + '）');
  }
  const text = await res.text();
  let j;
  try { j = JSON.parse(text); } catch (_) {
    throw new Error('GASの応答が不正です（HTTP ' + res.status + '）：' + text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 150));
  }
  if (!j.ok) throw new Error(j.error || '通信エラー');
  return j;
}

/* ===== 起動：今日の状況と今期の一覧を並行で読み込む ===== */
load();
function load() {
  api('status').then((s) => {
    if (!s.registered) return showReg();
    renderToday(s);
  }).catch((e) => toast(esc(e.message), 'err'));
  loadList();
}

function renderToday(s) {
  $('who').innerHTML = '<b>' + esc(s.name) + '</b> さん';
  $('today').textContent = s.dateLabel + ' の記録';
  const [dep, ret] = s.slots;
  $('slots').innerHTML = slotHtml(dep) + slotHtml(ret) +
    (dep.km !== null && ret.km !== null ? '<div class="dist">本日の移動 <b>' + fmt(ret.km - dep.km) + '</b> km</div>' : '') +
    '<h2 class="sec">今期の記録</h2>';
}

function slotHtml(sl) {
  let stateText = '未撮影', cls = '';
  if (sl.km !== null) { stateText = sl.warn ? '要確認' : '記録済み'; cls = sl.warn ? 'warn' : 'ok'; }
  else if (sl.saved) { stateText = sl.warn ? '読み取れませんでした（下の一覧から入力）' : '保存済み・読み取り中'; cls = sl.warn ? 'warn' : ''; }
  return '<div class="slot"><div class="slot-head"><span class="slot-name">' + sl.label + '</span>' +
    '<span class="slot-state ' + cls + '">' + stateText + '</span></div>' + odoHtml(sl.km, sl.saved && sl.km === null) + '</div>';
}

function odoHtml(km, waiting) {
  const digits = km === null ? '------' : String(km).padStart(6, '0');
  const lead = km === null ? 0 : Math.max(0, 6 - String(km).length);
  return '<div class="odo' + (waiting ? ' waiting' : '') + '" aria-label="' + (km === null ? '未記録' : km + 'キロ') + '">' +
    [...digits].map((d, i) => '<span class="d' + (i < lead || km === null ? ' blank' : '') + '">' + (km === null ? '–' : d) + '</span>').join('') +
    '<span class="unit">km</span></div>';
}

/* ===== 今期の一覧 ===== */
async function loadList() {
  try {
    const d = await api('list');
    state.list = d;
    $('total').innerHTML = '<div class="p">今期（' + esc(d.periodName) + '）の合計</div>' +
      '<div class="v">' + fmt(d.total) + ' km ／ ' + fmt(d.yen) + ' 円</div>';
    $('rows').innerHTML = d.rows.map((r, i) =>
      '<tr><td><span class="c">' + r.label + '</span></td>' + kmCell(r.dep, i, 8) + kmCell(r.ret, i, 9) +
      '<td><span class="c">' + (r.dist === null ? '' : fmt(r.dist)) + '</span></td></tr>').join('');
  } catch (e) { if (!/未登録/.test(e.message)) toast(esc(e.message), 'err'); }
}
function kmCell(c, i, col) {
  const cls = c.warn ? 'warn' : c.km === null ? 'none' : c.manual ? 'man' : '';
  const text = c.km === null ? (c.warn ? '⚠️' : '—') : (c.warn ? '⚠️' : '') + fmt(c.km);
  return '<td><button class="c ' + cls + '" data-i="' + i + '" data-col="' + col + '">' + text + '</button></td>';
}
$('rows').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-i]');
  if (b) openSheet(state.list.rows[Number(b.dataset.i)], Number(b.dataset.col));
});

/* ===== 写真の確認・数値の修正 ===== */
let editing = null;
async function openSheet(row, col) {
  const c = col === 8 ? row.dep : row.ret;
  editing = { dateKey: row.dateKey, col };
  $('sheetTitle').textContent = row.label + ' ' + LABEL[col];
  $('sheetKm').value = c.km === null ? '' : c.km;
  $('sheetPhoto').textContent = c.fileId ? '写真を読み込み中…' : '写真なし';
  $('sheetBg').classList.add('show');
  if (c.fileId) {
    try {
      const p = await api('photo', { fileId: c.fileId });
      $('sheetPhoto').innerHTML = '<img alt="' + esc(p.name) + '" src="data:image/jpeg;base64,' + p.image + '">';
    } catch (e) { $('sheetPhoto').textContent = e.message; }
  }
}
function closeSheet() { $('sheetBg').classList.remove('show'); editing = null; }
$('sheetCancel').addEventListener('click', closeSheet);
$('sheetBg').addEventListener('click', (e) => { if (e.target === $('sheetBg')) closeSheet(); });
$('sheetSave').addEventListener('click', async () => {
  const km = Number(toHalf($('sheetKm').value).replace(/[^\d]/g, ''));
  if (!editing || !km) return toast('距離計の数値を入力してください', 'err');
  try {
    const r = await api('correct', { ...editing, km });
    closeSheet();
    toast('<b>保存しました</b>' + (r.warnings.length ? '⚠️ ' + esc(r.warnings.join(' / ')) : ''), r.warnings.length ? '' : 'ok');
    load();
  } catch (e) { toast(esc(e.message), 'err'); }
});

/* ===== 初回登録（トークで社員番号を送っても登録できる） ===== */
function showReg() {
  $('view-main').hidden = true;
  $('view-reg').hidden = false;
}
$('regBtn').addEventListener('click', async () => {
  try {
    const s = await api('register', { empId: toHalf($('empId').value) });
    $('view-reg').hidden = true;
    $('view-main').hidden = false;
    renderToday(s);
    loadList();
    toast('<b>' + esc(s.name) + ' さんで登録しました</b>', 'ok');
  } catch (e) { toast(esc(e.message), 'err'); }
});

/* ===== 共通 ===== */
let toastTimer = null;
function toast(html, kind) {
  const t = $('toast');
  $('toastMsg').innerHTML = html;
  t.className = 'toast show ' + (kind || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), kind === 'err' ? 15000 : 4000);
}
function fmt(n) { return Math.round(n).toLocaleString('ja-JP'); }
function toHalf(s) { return String(s).replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
</script>
</body>
</html>
