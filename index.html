<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>交通費メーター</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://api.line.me">
<link rel="preconnect" href="https://static.line-scdn.net">
<link rel="preconnect" href="https://www.googleapis.com">
<style>
  :root {
    --sign: #1E4E9C; --sign-soft: #DCE6F5; --asphalt: #2B2F33; --paper: #F4F5F7; --line: #DDE1E5;
    --ink: #1C1F22; --sub: #5E666E; --card: #FFFFFF;
    --man: #1F8A4C; --warn: #B7791F; --bad: #C62828; --ok: #1F8A4C;
    --hdr: 56px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #14171A; --card: #1E2226; --line: #30363B; --ink: #ECEFF1; --sub: #9AA3AB; --asphalt: #0E1012;
      --sign: #4C7FD6; --sign-soft: #1F2C44; --man: #4CC27E; --warn: #E0A43A; --bad: #FF6B61; --ok: #4CC27E; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: var(--paper); color: var(--ink); font-size: 16px; line-height: 1.5;
    display: flex; flex-direction: column; height: 100dvh;
  }
  button { font: inherit; color: inherit; }

  /* ===== ヘッダー ===== */
  header {
    height: var(--hdr); flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px 0 16px; padding-top: env(safe-area-inset-top); gap: 8px;
  }
  .who { font-size: 14px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who b { color: var(--ink); font-weight: 600; font-size: 16px; }
  .hdr-r { display: flex; align-items: center; gap: 6px; }
  .tabs { display: flex; background: var(--line); border-radius: 999px; padding: 3px; }
  .tabs button { border: 0; background: transparent; color: var(--sub); font-size: 14px; padding: 7px 14px; border-radius: 999px; min-height: 36px; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); font-weight: 600; }
  .icon-btn { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; color: var(--sub); }
  .icon-btn svg { width: 22px; height: 22px; }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== 左右スワイプで切り替わるページ ===== */
  .pager { flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
  .pager::-webkit-scrollbar { display: none; }
  .page { flex: none; width: 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow-y: auto; overscroll-behavior-y: contain; }

  /* ===== 撮影ページ：情報は上、操作は下（親指の届く範囲） ===== */
  #page-shoot { display: flex; flex-direction: column; }
  .shoot-top { padding: 4px 16px 12px; }
  .date { font-size: 14px; color: var(--sub); margin: 4px 2px 10px; }
  .slot { margin-bottom: 12px; }
  .slot-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 6px; }
  .slot-name { font-size: 17px; font-weight: 700; }
  .slot-state { font-size: 13px; color: var(--sub); }
  .slot-state.ok { color: var(--ok); } .slot-state.warn { color: var(--warn); font-weight: 600; } .slot-state.bad { color: var(--bad); font-weight: 600; }
  .odo { display: flex; align-items: center; gap: 4px; background: var(--asphalt); padding: 8px 10px; border-radius: 10px; }
  .odo .d { flex: 1; max-width: 38px; height: 44px; display: grid; place-items: center; background: #111416; color: #F2F4F5; border-radius: 4px;
    font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; box-shadow: inset 0 -10px 12px rgba(255,255,255,.04), inset 0 8px 10px rgba(0,0,0,.5); }
  .odo .d.blank { color: #3A4046; }
  .odo.man .d:not(.blank) { color: #7FE3A5; }
  .odo.bad .d:not(.blank) { color: #FF8A80; }
  .odo .unit { color: #8A939B; font-size: 14px; margin-left: 6px; }
  .dist { text-align: right; font-size: 14px; color: var(--sub); margin: 0 2px; }
  .dist b { color: var(--ink); font-size: 18px; }
  .dist.bad b { color: var(--bad); }

  .shoot-bottom { margin-top: auto; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
  .shoot {
    height: 96px; border-radius: 22px; background: var(--sign); color: #fff; display: flex; align-items: center; justify-content: center; gap: 12px;
    font-size: 24px; font-weight: 700; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation;
    box-shadow: 0 6px 18px color-mix(in srgb, var(--sign) 35%, transparent);
  }
  .shoot:active { transform: scale(.98); }
  .shoot.busy { opacity: .6; pointer-events: none; }
  .shoot svg { width: 36px; height: 36px; }

  /* 出発／帰宅スイッチ：どこを押しても切り替わる */
  .sw { position: relative; height: 56px; border: 0; border-radius: 16px; background: var(--line); padding: 4px; display: grid; grid-template-columns: 1fr 1fr; cursor: pointer; touch-action: manipulation; }
  .sw .knob { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); background: var(--card); border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.15); transition: transform .18s ease; }
  .sw[aria-checked="true"] .knob { transform: translateX(100%); }
  .sw span { position: relative; z-index: 1; display: grid; place-items: center; font-size: 17px; font-weight: 600; color: var(--sub); pointer-events: none; }
  .sw span .s { font-size: 11px; font-weight: 500; margin-left: 4px; }
  .sw[aria-checked="false"] span:first-of-type, .sw[aria-checked="true"] span:last-of-type { color: var(--ink); }
  .hint { text-align: center; font-size: 12px; color: var(--sub); margin: -4px 0 0; }

  /* ===== 記録ページ ===== */
  #page-list { padding: 4px 16px calc(24px + env(safe-area-inset-bottom)); }
  .total { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px 14px; margin: 4px 0 10px; }
  .total .p { font-size: 13px; color: var(--sub); text-align: center; margin-bottom: 4px; }
  .total .v { display: flex; justify-content: space-evenly; align-items: baseline; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .total .v .sl { color: var(--sub); font-weight: 400; }
  .total .v small { font-size: 14px; font-weight: 600; margin-left: 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--sub); margin: 0 2px 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { font-size: 12px; color: var(--sub); font-weight: 500; text-align: right; padding: 4px 6px; }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 0; border-top: 1px solid var(--line); text-align: right; }
  td .c { display: block; padding: 12px 6px; font-size: 15px; min-height: 48px; }
  td button.c { width: 100%; border: 0; background: none; text-align: right; }
  .c.man { color: var(--man); font-weight: 600; }
  .c.warn { color: var(--warn); font-weight: 700; }
  .c.bad { color: var(--bad); font-weight: 700; }
  .c.none { color: var(--sub); }
  .c.ok::after { content: " ✓"; color: var(--ok); font-size: 12px; }
  .empty { text-align: center; color: var(--sub); padding: 32px 0; font-size: 14px; }
  .skel { height: 18px; border-radius: 6px; background: linear-gradient(90deg, var(--line), var(--card), var(--line)); background-size: 200% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }

  /* ===== トースト：画面の上に「重ねず」ヘッダーの下に差し込む（内容は下にずれるだけ）。スワイプか×で消える ===== */
  .toast {
    flex: none; margin: 0 12px 8px; display: none;
    background: var(--ink); color: var(--paper); border-radius: 14px; padding: 10px 6px 10px 14px;
    align-items: center; gap: 8px; font-size: 14px; touch-action: pan-y; transition: transform .18s, opacity .18s;
  }
  .toast.show { display: flex; animation: tin .18s ease-out; }
  @keyframes tin { from { opacity: 0; transform: translateY(-8px); } }
  .toast.drag { transition: none; }
  .toast .msg { flex: 1; min-width: 0; }
  .toast .msg b { display: block; font-size: 16px; }
  .toast.ok { background: var(--ok); color: #fff; }
  .toast.err { background: var(--bad); color: #fff; }
  .toast .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .toast .acts button { border: 1px solid rgba(255,255,255,.75); background: transparent; font-size: 13px; padding: 8px 10px; border-radius: 10px; white-space: nowrap; min-height: 40px; }
  .toast .x { border: 0; background: transparent; width: 40px; height: 40px; font-size: 20px; opacity: .8; flex: none; }

  /* ===== 修正シート ===== */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; z-index: 30; }
  .sheet-bg.show { display: flex; }
  .sheet { width: 100%; background: var(--card); border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 92dvh; overflow-y: auto; }
  .sheet h2 { font-size: 18px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .sheet h2 .tag { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--line); color: var(--sub); }
  .sheet h2 .tag.man { background: color-mix(in srgb, var(--man) 18%, transparent); color: var(--man); }
  .sheet h2 .tag.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .sheet h2 .tag.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .sheet h2 .tag.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .photo { width: 100%; min-height: 120px; max-height: 42dvh; background: var(--line); border-radius: 10px; display: grid; place-items: center; color: var(--sub); font-size: 14px; overflow: hidden; }
  .photo img { width: 100%; max-height: 42dvh; object-fit: contain; display: block; }
  .field { margin: 12px 0; }
  .field label { font-size: 13px; color: var(--sub); }
  .field input { width: 100%; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); }
  .field input:focus { outline: none; border-color: var(--sign); }
  .row { display: flex; gap: 10px; margin-top: 10px; }
  .btn { flex: 1; min-height: 52px; border-radius: 12px; border: 0; font-size: 15px; font-weight: 700; padding: 0 8px; }
  .btn.pri { background: var(--sign); color: #fff; }
  .btn.sec { background: var(--line); color: var(--ink); }
  .btn.okb { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .btn:disabled { opacity: .45; }

  .reg { position: fixed; inset: 0; background: var(--paper); z-index: 25; padding: 72px 20px 24px; }
  .reg h1 { font-size: 22px; margin: 0 0 6px; }
  .reg p { color: var(--sub); margin: 0 0 18px; font-size: 14px; }
  .debug { position: fixed; left: 8px; right: 8px; bottom: 180px; background: rgba(0,0,0,.8); color: #9fe; font: 11px ui-monospace, Menlo, monospace; white-space: pre-wrap; padding: 8px; border-radius: 8px; max-height: 30dvh; overflow-y: auto; pointer-events: none; z-index: 40; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--sign); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .toast, .sw .knob { transition: none; animation: none; } .pager { scroll-behavior: auto; } }
</style>
</head>
<body>
<header>
  <div class="who" id="who">読み込み中…</div>
  <div class="hdr-r">
    <div class="tabs" id="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-page="0">撮影</button>
      <button role="tab" aria-selected="false" data-page="1">記録</button>
    </div>
    <button class="icon-btn" id="reload" aria-label="最新の状態に更新">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </div>
</header>

<div class="toast" id="toast" role="status" aria-live="polite">
  <div class="msg" id="toastMsg"></div>
  <div class="acts" id="toastActs"></div>
  <button class="x" id="toastX" aria-label="閉じる">×</button>
</div>

<div class="pager" id="pager">
  <!-- 撮影 -->
  <section class="page" id="page-shoot" aria-label="撮影">
    <div class="shoot-top">
      <div class="date" id="today">&nbsp;</div>
      <div id="slots"><div class="skel" style="height:96px"></div><div class="skel" style="height:96px;margin-top:12px"></div></div>
    </div>
    <div class="shoot-bottom">
      <label class="shoot" id="shoot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span id="shootLabel">出発を撮影</span>
        <input id="cam" type="file" accept="image/*" capture="environment" hidden>
      </label>
      <button class="sw" id="sw" role="switch" aria-checked="false" aria-label="出発と帰宅の切り替え">
        <i class="knob"></i><span>出発<span class="s" id="swDep"></span></span><span>帰宅<span class="s" id="swRet"></span></span>
      </button>
      <p class="hint">「保存完了」が出たら、すぐ閉じて大丈夫です</p>
    </div>
  </section>

  <!-- 記録 -->
  <section class="page" id="page-list" aria-label="記録">
    <div class="total" id="total"><div class="p">今期の合計</div><div class="skel"></div></div>
    <div class="legend">
      <span><i style="background:var(--man)"></i>手入力</span>
      <span><i style="background:var(--warn)"></i>⚠️ 要確認</span>
      <span><i style="background:var(--bad)"></i>異常値</span>
      <span><span style="color:var(--ok)">✓</span> 確認済み</span>
    </div>
    <table>
      <thead><tr><th>日付</th><th>出発</th><th>帰宅</th><th>距離</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</div>

<!-- 初回登録 -->
<section class="reg" id="reg" hidden>
  <h1>社員番号を登録</h1>
  <p>最初の1回だけ必要です。交通費シートの社員番号（6桁）を入力してください。</p>
  <div class="field">
    <label for="empId">社員番号</label>
    <input id="empId" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off">
  </div>
  <button class="btn pri" id="regBtn" style="width:100%">登録する</button>
</section>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2><span id="sheetTitle"></span><span class="tag" id="sheetTag"></span></h2>
    <div class="photo" id="sheetPhoto">写真なし</div>
    <div class="field">
      <label for="sheetKm">距離計（km）</label>
      <input id="sheetKm" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
    </div>
    <div class="row">
      <button class="btn okb" id="sheetConfirm">✓ 確認済みにする</button>
      <button class="btn sec" id="sheetSwap">⇄ 出発・帰宅を入替</button>
    </div>
    <div class="row">
      <button class="btn sec" id="sheetCancel">閉じる</button>
      <button class="btn pri" id="sheetSave">この数値で保存</button>
    </div>
  </div>
</div>

<canvas id="canvas" hidden></canvas>
<div class="debug" id="debug" hidden></div>

<script>
/* ===== 設定 ===== */
const LIFF_ID = '2011171675-iQ6TuVBt';
const GAS_URL = 'https://script.google.com/macros/s/AKfycby_wWHyTDQs3FDwBQKTtLPie91Goe2DrSHnUslWPpDTz9qKYBM0Ka7o4Y1mcIflX3LWqg/exec';
const MAX_EDGE = 1280;       // 送信する画像の長辺（px）
const JPEG_Q = 0.8;
const DIRECT_UPLOAD = true;  // 端末→Driveへ直接送る（失敗したら自動でGAS経由）
const SWITCH_HOUR = 13;      // この時刻より前は「出発」、以降は「帰宅」を初期選択
const MAX_DAY_KM = 300;      // 1日の距離がこれを超えたら異常値（赤）

const LABEL = { 8: '出発', 9: '帰宅' };
const $ = (id) => document.getElementById(id);
const state = { status: null, list: null, sessions: {}, col: 8, userPicked: false, listLoaded: false };
const DEBUG = /debug(=|%3D)1/.test(location.search);
function dbg(m) { if (!DEBUG) return; $('debug').hidden = false; $('debug').textContent += Math.round(performance.now()) + 'ms ' + m + '\n'; }
function buzz() { try { navigator.vibrate && navigator.vibrate(8); } catch (_) {} }
dbg('画面表示（ボタン操作可）');

/* ===== LIFF：ページ表示を止めないよう、表示後にSDKを読み込む ===== */
const ready = new Promise((resolve, reject) => {
  const start = () => {
    const sc = document.createElement('script');
    sc.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
    sc.onload = async () => {
      try {
        await liff.init({ liffId: LIFF_ID });
        dbg('LIFF初期化完了');
        if (!liff.isLoggedIn()) { liff.login(); return; }
        resolve(liff.getIDToken());
      } catch (e) { reject(e); }
    };
    sc.onerror = () => reject(new Error('LINEの読み込みに失敗しました。通信状況を確認してください。'));
    document.head.appendChild(sc);
  };
  if (document.readyState === 'complete') start(); else window.addEventListener('load', start);
});

async function api(action, data = {}) {
  const idToken = await ready;
  if (!idToken) throw new Error('LINEのIDトークンを取得できません（LIFF設定のScopeで openid をオンにしてください）');
  let res;
  try {
    res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action, idToken, ...data }) }); // text/plain＝プリフライトなし
  } catch (e) { throw new Error('サーバーに接続できません。通信状況を確認してください。（' + e.message + '）'); }
  const text = await res.text();
  let j;
  try { j = JSON.parse(text); } catch (_) {
    throw new Error('サーバーの応答が不正です（HTTP ' + res.status + '）：' + text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 150));
  }
  if (!j.ok) {
    if (/有効期限/.test(j.error) && !sessionStorage.getItem('relogin')) { sessionStorage.setItem('relogin', '1'); location.reload(); }
    throw new Error(j.error || '通信エラー');
  }
  sessionStorage.removeItem('relogin');
  return j;
}
function fire(action, data = {}) {
  return ready.then((idToken) => fetch(GAS_URL, { method: 'POST', keepalive: true, body: JSON.stringify({ action, idToken, ...data }) })
    .then((r) => r.json()).catch(() => null));
}
const directEnabled = () => DIRECT_UPLOAD && localStorage.getItem('noDirect') !== '1';

/* ===== 起動 ===== */
refreshStatus().then(flushOutbox);

async function refreshStatus() {
  try {
    const s = await api('status', { direct: directEnabled(), origin: location.origin });
    dbg('status完了（サーバー ' + s.serverMs + 'ms）');
    state.status = s;
    state.sessions = s.uploads || {};
    if (!s.registered) { $('reg').hidden = false; return; }
    $('reg').hidden = true;
    if (!state.userPicked) setCol(defaultCol(), false);
    render();
  } catch (e) { toast(esc(e.message), 'err'); }
}

/** 初期選択：時刻で決め、その区分が撮影済みでもう一方が未撮影ならもう一方 */
function defaultCol() {
  let c = new Date().getHours() < SWITCH_HOUR ? 8 : 9;
  const s = state.status;
  if (s && s.slots) {
    const me = s.slots.find((x) => x.col === c), other = s.slots.find((x) => x.col !== c);
    if (me.saved && !other.saved) c = other.col;
  }
  return c;
}

function render() {
  const s = state.status;
  $('who').innerHTML = '<b>' + esc(s.name) + '</b> さん';
  $('today').textContent = s.dateLabel + ' の記録';
  const [dep, ret] = s.slots;
  const dist = dep.km !== null && ret.km !== null ? ret.km - dep.km : null;
  const bad = dist !== null && (dist < 0 || dist > MAX_DAY_KM);
  $('slots').innerHTML = slotHtml(dep, bad) + slotHtml(ret, bad) +
    (dist !== null ? '<div class="dist' + (bad ? ' bad' : '') + '">本日の移動 <b>' + fmt(dist) + '</b> km' + (bad ? '（要確認）' : '') + '</div>' : '');
  $('swDep').textContent = dep.saved ? '✓' : '';
  $('swRet').textContent = ret.saved ? '✓' : '';
}
function slotHtml(sl, bad) {
  let t = '未撮影', cls = '';
  if (sl.km !== null) { t = bad ? '異常値' : sl.warn ? '要確認' : '記録済み'; cls = bad ? 'bad' : sl.warn ? 'warn' : 'ok'; }
  else if (sl.saved) { t = sl.warn ? '読み取れませんでした（記録で入力）' : '保存済み・読み取り中'; cls = sl.warn ? 'warn' : ''; }
  const digits = sl.km === null ? '------' : String(sl.km).padStart(6, '0');
  const lead = sl.km === null ? 0 : Math.max(0, 6 - String(sl.km).length);
  return '<div class="slot"><div class="slot-head"><span class="slot-name">' + sl.label + '</span><span class="slot-state ' + cls + '">' + t + '</span></div>' +
    '<div class="odo' + (bad && sl.km !== null ? ' bad' : '') + '">' +
    [...digits].map((d, i) => '<span class="d' + (i < lead || sl.km === null ? ' blank' : '') + '">' + (sl.km === null ? '–' : d) + '</span>').join('') +
    '<span class="unit">km</span></div></div>';
}

/* ===== 出発／帰宅スイッチ（どこを押しても切り替え） ===== */
function setCol(c, byUser) {
  state.col = c;
  if (byUser) state.userPicked = true;
  $('sw').setAttribute('aria-checked', String(c === 9));
  $('shootLabel').textContent = LABEL[c] + 'を撮影';
}
$('sw').addEventListener('click', () => { buzz(); setCol(state.col === 8 ? 9 : 8, true); });

/* ===== 撮影 → 同じ写真チェック → 縮小 → 端末に一時保存 → 送信 ===== */
$('cam').addEventListener('change', async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  const takenAt = Date.now(), col = state.col, t0 = performance.now();
  $('shoot').classList.add('busy');
  const done = () => $('shoot').classList.remove('busy');

  // 同じ画像を2回保存しない（元の写真のハッシュで判定）
  const [hash, blob] = await Promise.all([fileHash(file).catch(() => ''), shrink(file).catch(() => null)]);
  if (!blob) { done(); return toast('写真を読み込めませんでした。もう一度撮影してください。', 'err'); }
  if (hash && sentHashes().includes(hash)) { done(); return toast('<b>この写真は送信済みです</b>同じ写真は保存しません。', 'err'); }
  const t1 = performance.now();

  const sess = state.sessions[col] && state.sessions[col].expiresAt > Date.now() + 30000 ? state.sessions[col] : null;
  const cid = sess ? sess.cid : uuid();
  let localId = null;
  try { localId = await outbox.add({ buf: await blob.arrayBuffer(), takenAt, cid, col, hash }); } catch (_) {}
  toast('<b>送信中…</b>' + LABEL[col] + (localId ? '（端末に一時保存済み）' : ''), '');

  let r = null, route = '';
  if (sess && directEnabled()) {
    try {
      const res = await fetch(sess.url, { method: 'PUT', headers: { 'Content-Type': 'image/jpeg' }, body: blob });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      r = { fileId: j.id, name: j.name || sess.name, col };
      route = '直接';
    } catch (e) { dbg('直接アップロード失敗→GAS経由：' + e.message); localStorage.setItem('noDirect', '1'); }
    delete state.sessions[col];
  }
  if (!r) {
    try {
      r = await api('upload', { image: await toBase64(blob), takenAt, cid, col });
      route = 'GAS経由';
    } catch (e) {
      done();
      return toast('<b>送信できませんでした</b>' + esc(e.message) + (localId ? '<br>写真は端末に保存済みです。次に開いたとき自動で送ります。' : ''), 'err', [], 15000);
    }
  }
  const t2 = performance.now();
  if (localId) outbox.del(localId).catch(() => {});
  if (hash) rememberHash(hash);
  done(); buzz();
  dbg('準備 ' + Math.round(t1 - t0) + 'ms / 送信(' + route + ') ' + Math.round(t2 - t1) + 'ms / 合計 ' + Math.round(t2 - t0) + 'ms / ' + Math.round(blob.size / 1024) + 'KB');

  toast('<b>保存完了（' + esc(r.name) + '）</b>閉じても大丈夫です', 'ok',
    [{ label: '⇄ ' + LABEL[r.col === 8 ? 9 : 8] + 'に変更', onClick: () => swapFile(r.fileId) }], 6000);
  if (state.status) {
    const sl = state.status.slots.find((x) => x.col === r.col);
    if (sl) { sl.saved = true; sl.km = null; sl.warn = false; }
    render();
  }
  state.userPicked = false;
  setCol(r.col === 8 ? 9 : 8, false);

  // 読み取り結果が出たら（画面を開いたままなら）確認用のトーストを出す
  fire('process', { fileId: r.fileId }).then((res) => {
    refreshStatus();
    if (state.listLoaded) loadList();
    const x = res && res.ok && res.result;
    if (!x) return;
    if (x.duplicate) return toast('<b>同じ写真が登録済みでした</b>2枚目は保存していません。', 'err');
    const d = { dateKey: x.dateKey, col: x.col, km: x.km, fileId: x.fileId, label: dateLabelFromKey(x.dateKey) };
    if (x.km === null) return toast('<b>数値を読み取れませんでした</b>' + LABEL[x.col] + '：手で入力してください', 'err', [{ label: '入力する', onClick: () => openEditor(d) }], 15000);
    toast('<b>' + LABEL[x.col] + '：' + fmt(x.km) + ' km</b>' + (x.warnings.length ? '⚠️ ' + esc(x.warnings.join(' / ')) : '読み取り結果'), x.warnings.length ? '' : 'ok',
      [{ label: '✓ 正しい', onClick: () => confirmCell(d) }, { label: '修正', onClick: () => openEditor(d) }], 12000);
  });
});

async function swapFile(fileId) {
  try { const r = await api('swap', { fileId }); toast('<b>' + esc(r.name) + ' に変更しました</b>', 'ok'); refreshStatus(); if (state.listLoaded) loadList(); }
  catch (e) { toast(esc(e.message), 'err'); }
}
async function confirmCell(d) {
  try { await api('confirm', { dateKey: d.dateKey, col: d.col }); buzz(); toast('<b>確認済みにしました</b>', 'ok'); refreshStatus(); if (state.listLoaded) loadList(); }
  catch (e) { toast(esc(e.message), 'err'); }
}

async function shrink(file) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (_) { src = await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); }); }
  const k = Math.min(1, MAX_EDGE / Math.max(src.width, src.height));
  const c = $('canvas');
  c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  if (src.close) src.close();
  return new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error('toBlob'))), 'image/jpeg', JPEG_Q));
}
async function fileHash(file) {
  if (!crypto.subtle) return '';
  const d = await crypto.subtle.digest('SHA-256', await file.arrayBuffer());
  return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
function sentHashes() { try { return JSON.parse(localStorage.getItem('sentHashes') || '[]'); } catch (_) { return []; } }
function rememberHash(h) { const a = sentHashes().filter((x) => x !== h); a.push(h); localStorage.setItem('sentHashes', JSON.stringify(a.slice(-60))); }
function toBase64(blob) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(blob); }); }
function uuid() { return (crypto.randomUUID && crypto.randomUUID()) || (Date.now().toString(36) + Math.random().toString(36).slice(2)); }

/* ===== 送れなかった写真の自動再送 ===== */
const outbox = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open('odo-outbox', 2); r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('q')) r.result.createObjectStore('q', { keyPath: 'id', autoIncrement: true }); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async run(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('q', mode); const q = fn(t.objectStore('q')); t.oncomplete = () => res(q.result); t.onerror = () => rej(t.error); }); },
  add(x) { return this.run('readwrite', (s) => s.add(x)); },
  all() { return this.run('readonly', (s) => s.getAll()); },
  del(id) { return this.run('readwrite', (s) => s.delete(id)); },
};
async function flushOutbox() {
  let items = [];
  try { items = await outbox.all(); } catch (_) { return; }
  let sent = 0;
  for (const it of items) {
    try {
      const image = it.image || await toBase64(new Blob([it.buf], { type: 'image/jpeg' }));
      const r = await api('upload', { image, takenAt: it.takenAt, cid: it.cid, col: it.col, retry: true });
      await outbox.del(it.id);
      if (it.hash) rememberHash(it.hash);
      if (!r.duplicate) fire('process', { fileId: r.fileId });
      sent++;
    } catch (_) { break; }
  }
  if (sent) { toast('<b>未送信だった写真を ' + sent + ' 件送りました</b>', 'ok'); refreshStatus(); }
}

/* ===== 記録 ===== */
async function loadList() {
  state.listLoaded = true;
  try {
    const d = await api('list');
    state.list = d;
    markAnomalies(d.rows);
    $('total').innerHTML = '<div class="p">' + esc(d.periodName) + ' の合計</div>' +
      '<div class="v"><span>' + fmt(d.total) + '<small>km</small></span><span class="sl">／</span><span>' + fmt(d.yen) + '<small>円</small></span></div>';
    $('rows').innerHTML = d.rows.length ? d.rows.map((r, i) =>
      '<tr><td><span class="c">' + r.label + '</span></td>' + kmCell(r.dep, i, 8) + kmCell(r.ret, i, 9) +
      '<td><span class="c' + (r.distBad ? ' bad' : '') + '">' + (r.dist === null ? '' : fmt(r.dist)) + '</span></td></tr>').join('')
      : '<tr><td colspan="4"><div class="empty">今期の記録はまだありません</div></td></tr>';
  } catch (e) { toast(esc(e.message), 'err'); }
}
/** 前回より小さい値・マイナスや大きすぎる距離を異常値にする */
function markAnomalies(rows) {
  let prev = null;
  [...rows].reverse().forEach((r) => {
    ['dep', 'ret'].forEach((k) => { const c = r[k]; if (c.km !== null) { c.bad = prev !== null && c.km < prev; prev = c.km; } });
    r.distBad = r.dist !== null && (r.dist < 0 || r.dist > MAX_DAY_KM);
    if (r.dist !== null && r.dist < 0) { r.dep.bad = true; r.ret.bad = true; }
  });
}
function cellClass(c) { return c.bad ? 'bad' : c.warn ? 'warn' : c.km === null ? 'none' : c.manual ? 'man' : c.confirmed ? 'ok' : ''; }
function kmCell(c, i, col) {
  const text = c.km === null ? (c.warn ? '⚠️' : '—') : (c.warn && !c.bad ? '⚠️' : '') + fmt(c.km);
  return '<td><button class="c ' + cellClass(c) + '" data-i="' + i + '" data-col="' + col + '">' + text + '</button></td>';
}
$('rows').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-i]');
  if (!b) return;
  const r = state.list.rows[Number(b.dataset.i)], col = Number(b.dataset.col), c = col === 8 ? r.dep : r.ret;
  openEditor({ dateKey: r.dateKey, label: r.label, col, ...c });
});

let editing = null;
async function openEditor(d) {
  editing = d;
  $('sheetTitle').textContent = d.label + ' ' + LABEL[d.col];
  const tag = $('sheetTag'), cls = cellClass(d);
  tag.className = 'tag ' + cls;
  tag.textContent = { bad: '異常値', warn: '要確認', man: '手入力', ok: '確認済み', none: '未入力' }[cls] || 'AI読み取り';
  $('sheetKm').value = d.km === null || d.km === undefined ? '' : d.km;
  $('sheetConfirm').disabled = d.km === null || d.km === undefined || d.confirmed;
  $('sheetPhoto').textContent = d.fileId ? '写真を読み込み中…' : '写真なし';
  $('sheetBg').classList.add('show');
  if (d.fileId) {
    try { const p = await api('photo', { fileId: d.fileId }); if (editing === d) $('sheetPhoto').innerHTML = '<img alt="' + esc(p.name) + '" src="data:image/jpeg;base64,' + p.image + '">'; }
    catch (e) { $('sheetPhoto').textContent = e.message; }
  }
}
function closeSheet() { $('sheetBg').classList.remove('show'); editing = null; }
$('sheetCancel').addEventListener('click', closeSheet);
$('sheetBg').addEventListener('click', (e) => { if (e.target === $('sheetBg')) closeSheet(); });
$('sheetSave').addEventListener('click', async () => {
  const km = Number(toHalf($('sheetKm').value).replace(/[^\d]/g, ''));
  if (!editing || !km) return toast('距離計の数値を入力してください', 'err');
  try {
    const r = await api('correct', { dateKey: editing.dateKey, col: editing.col, km });
    closeSheet(); buzz();
    toast('<b>保存しました</b>' + (r.warnings.length ? '⚠️ ' + esc(r.warnings.join(' / ')) : ''), r.warnings.length ? '' : 'ok');
    loadList(); refreshStatus();
  } catch (e) { toast(esc(e.message), 'err'); }
});
$('sheetConfirm').addEventListener('click', async () => { const d = editing; closeSheet(); await confirmCell(d); });
$('sheetSwap').addEventListener('click', async () => {
  const d = editing; closeSheet();
  try { await api('swapDay', { dateKey: d.dateKey }); buzz(); toast('<b>' + d.label + ' の出発と帰宅を入れ替えました</b>', 'ok'); loadList(); refreshStatus(); }
  catch (e) { toast(esc(e.message), 'err'); }
});

/* ===== 初回登録 ===== */
$('regBtn').addEventListener('click', async () => {
  try {
    const s = await api('register', { empId: toHalf($('empId').value), direct: directEnabled(), origin: location.origin });
    state.status = s; state.sessions = s.uploads || {};
    $('reg').hidden = true; setCol(defaultCol(), false); render();
    toast('<b>' + esc(s.name) + ' さんで登録しました</b>', 'ok');
  } catch (e) { toast(esc(e.message), 'err'); }
});

/* ===== 左右スワイプでページ切り替え（タブと連動） ===== */
const pager = $('pager');
let pageIdx = 0;
function goPage(i) { pager.scrollTo({ left: i * pager.clientWidth, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => goPage(Number(b.dataset.page))));
pager.addEventListener('scroll', () => {
  const i = Math.round(pager.scrollLeft / Math.max(1, pager.clientWidth));
  if (i === pageIdx) return;
  pageIdx = i;
  document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-selected', String(Number(b.dataset.page) === i)));
  if (i === 1 && !state.listLoaded) loadList();
}, { passive: true });
window.addEventListener('resize', () => pager.scrollTo({ left: pageIdx * pager.clientWidth }));

/* ===== 更新ボタン ===== */
$('reload').addEventListener('click', async () => {
  const b = $('reload');
  if (b.classList.contains('spin')) return;
  b.classList.add('spin');
  await Promise.all([refreshStatus(), state.listLoaded || pageIdx === 1 ? loadList() : null, flushOutbox()]);
  b.classList.remove('spin');
});

/* ===== トースト（ヘッダーの下。左右・上へのスワイプか×で消える） ===== */
let toastTimer = null;
function toast(html, kind, actions, ms) {
  const t = $('toast');
  $('toastMsg').innerHTML = html;
  t.className = 'toast show ' + (kind || '');
  t.style.transform = ''; t.style.opacity = '';
  const box = $('toastActs');
  box.innerHTML = '';
  (actions || []).forEach((a) => {
    const b = document.createElement('button');
    b.textContent = a.label;
    b.onclick = () => { hideToast(); a.onClick(); };
    box.appendChild(b);
  });
  clearTimeout(toastTimer);
  if (kind) toastTimer = setTimeout(hideToast, ms || (kind === 'err' ? 12000 : 4000));
}
function hideToast() { const t = $('toast'); t.classList.remove('show', 'drag'); t.style.transform = ''; t.style.opacity = ''; }
$('toastX').addEventListener('click', hideToast);
(() => {
  const t = $('toast');
  let sx = 0, sy = 0, dx = 0, dy = 0, on = false;
  t.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) return; on = true; sx = e.clientX; sy = e.clientY; dx = dy = 0; t.classList.add('drag'); clearTimeout(toastTimer); });
  window.addEventListener('pointermove', (e) => {
    if (!on) return;
    dx = e.clientX - sx; dy = Math.min(0, e.clientY - sy);
    t.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    t.style.opacity = String(Math.max(.2, 1 - (Math.abs(dx) + Math.abs(dy)) / 220));
  });
  window.addEventListener('pointerup', () => {
    if (!on) return;
    on = false; t.classList.remove('drag');
    if (Math.abs(dx) > 70 || dy < -35) {
      t.style.transform = 'translate(' + (dx === 0 ? 0 : Math.sign(dx) * 480) + 'px,' + (dy < -35 ? -120 : 0) + 'px)'; t.style.opacity = '0';
      setTimeout(hideToast, 180);
    } else { t.style.transform = ''; t.style.opacity = ''; toastTimer = setTimeout(hideToast, 5000); }
  });
})();

/* ===== 共通 ===== */
function dateLabelFromKey(k) { const [y, m, d] = k.split('-').map(Number); const dt = new Date(y, m - 1, d); return m + '/' + d + '(' + '日月火水木金土'[dt.getDay()] + ')'; }
function fmt(n) { return Math.round(n).toLocaleString('ja-JP'); }
function toHalf(s) { return String(s).replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
</script>
