<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>標準カメラ方式テスト</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://api.line.me">
<script async id="liffsdk" src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: #111; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; gap: 16px; text-align: center; }
  .tag { font-size: 13px; color: #8A939B; }
  label.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    background: #1E4E9C; color: #fff; font-size: 20px; font-weight: 700;
    padding: 22px 32px; border-radius: 18px; min-width: 220px;
  }
  label.btn svg { width: 26px; height: 26px; }
  label.btn:active { transform: scale(.97); }
  p.hint { color: #9AA3AB; font-size: 13px; max-width: 320px; margin: 0; }
  .toast {
    position: fixed; left: 16px; right: 16px; top: calc(24px + env(safe-area-inset-top));
    background: rgba(20,22,24,.95); border-radius: 16px; padding: 18px 16px; font-size: 15px;
    display: none; text-align: left;
  }
  .toast.show { display: block; }
  .toast b { display: block; font-size: 18px; margin-bottom: 4px; }
  .toast.ok b { color: #5BD18C; }
  .toast.err b { color: #FF7A6B; }
  .debug {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: #000; color: #8A939B; font: 12px ui-monospace, Menlo, monospace; white-space: pre-wrap;
    max-height: 40vh; overflow-y: auto;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="tag" id="tag">読み込み中…</div>
<label class="btn" id="btn">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
  <span id="btnLabel">タップして撮影</span>
  <input id="file" type="file" accept="image/*" capture="environment" hidden>
</label>
<p class="hint">標準のカメラアプリが開くはずです。背面カメラで開くか、許可の確認が出るかを確認してください。</p>

<div class="toast" id="toast"><div id="toastMsg"></div></div>
<div class="debug" id="debug"></div>
<canvas id="canvas" hidden></canvas>

<script>
/* ===== 設定 ===== */
const LIFF_ID = '2011171675-bSqxbh7t';
const GAS_URL = 'https://script.google.com/macros/s/AKfycby_wWHyTDQs3FDwBQKTtLPie91Goe2DrSHnUslWPpDTz9qKYBM0Ka7o4Y1mcIflX3LWqg/exec';
const MAX_EDGE = 1600;
const JPEG_Q = 0.85;
const AUTO_CLOSE_MS = 0; // テスト中は0（自動で閉じない）。本採用時は 2500 などに

const $ = (id) => document.getElementById(id);
const log = [];
function dbg(line) {
  log.push(line);
  $('debug').textContent = log.join('\n');
}
const mark = { open: performance.now() };

/* ===== LINE初期化（並行して進める） ===== */
const ready = (async () => {
  if (!window.liff) await new Promise((res) => $('liffsdk').addEventListener('load', res));
  await liff.init({ liffId: LIFF_ID });
  dbg('LIFF初期化 ' + ms() + 'ms');
  if (!liff.isLoggedIn()) { liff.login(); return new Promise(() => {}); }
  return liff.getIDToken();
})();
ready.catch((e) => toast('LIFFエラー', e.message, 'err'));

async function api(action, data = {}) {
  const idToken = await ready;
  if (!idToken) throw new Error('IDトークンを取得できません（LIFF設定のScopeで openid を確認）');
  let res;
  try {
    res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action, idToken, ...data }) });
  } catch (e) {
    throw new Error('GASに接続できません（' + e.message + '）');
  }
  const text = await res.text();
  let j;
  try { j = JSON.parse(text); } catch (_) {
    throw new Error('GASの応答が不正です（HTTP ' + res.status + '）：' + text.slice(0, 150));
  }
  if (!j.ok) throw new Error(j.error || '通信エラー');
  return j;
}
function fire(action, data) {
  ready.then((idToken) => fetch(GAS_URL, { method: 'POST', keepalive: true,
    body: JSON.stringify({ action, idToken, ...data }) })).catch(() => {});
}
function ms() { return Math.round(performance.now() - mark.open); }

/* ===== 標準カメラを開く（ページを開いたら自動で試す。ブロックされたらボタンでタップ） ===== */
window.addEventListener('load', () => { try { $('file').click(); } catch (_) {} });
$('btn').addEventListener('click', () => dbg('タップで撮影ダイアログを開いた ' + ms() + 'ms'));

$('file').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) { dbg('キャンセルされた ' + ms() + 'ms'); return; }
  dbg('写真を選択 ' + ms() + 'ms（' + Math.round(f.size / 1024) + 'KB, ' + f.type + '）');
  $('btnLabel').textContent = '送信中…';

  let src;
  try { src = await createImageBitmap(f, { imageOrientation: 'from-image' }); }
  catch (_) { src = await new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = j; i.src = URL.createObjectURL(f); }); }
  const k = Math.min(1, MAX_EDGE / Math.max(src.width, src.height));
  const c = $('canvas');
  c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  const image = c.toDataURL('image/jpeg', JPEG_Q).split(',')[1];
  dbg('縮小完了 ' + ms() + 'ms（' + c.width + '×' + c.height + ', ' + Math.round(image.length * 0.75 / 1024) + 'KB）');

  try {
    const r = await api('upload', { image, takenAt: Date.now() });
    dbg('保存完了 ' + ms() + 'ms（' + r.name + '）');
    fire('process', { fileId: r.fileId });
    toast('✅ 保存完了', r.name + '<br>閉じても大丈夫です', 'ok');
    $('btnLabel').textContent = 'もう一度撮影';
    if (AUTO_CLOSE_MS) setTimeout(() => liff.closeWindow(), AUTO_CLOSE_MS);
  } catch (err) {
    dbg('エラー ' + ms() + 'ms：' + err.message);
    toast('送信できませんでした', err.message, 'err');
    $('btnLabel').textContent = 'もう一度試す';
  }
});

/* ===== 表示 ===== */
api('status').then((s) => {
  $('tag').textContent = s.registered ? s.name + ' さん' : '未登録（先にトークで社員番号を送ってください）';
}).catch((e) => { $('tag').textContent = ''; dbg('status エラー：' + e.message); });

function toast(title, body, kind) {
  const t = $('toast');
  $('toastMsg').innerHTML = '<b>' + title + '</b>' + (body || '');
  t.className = 'toast show ' + (kind || '');
}
</script>
</body>
</html>
