<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>メーター撮影</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://api.line.me">
<script async id="liffsdk" src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .top { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; }
  .slot { display: inline-block; background: rgba(0,0,0,.55); padding: 6px 16px; border-radius: 999px; font-size: 18px; font-weight: 700; }
  .guide { position: fixed; left: 8%; right: 8%; top: 38%; height: 18%; border: 2px solid rgba(255,255,255,.6); border-radius: 12px; pointer-events: none; }
  .guide span { position: absolute; top: -26px; left: 0; right: 0; text-align: center; font-size: 13px; color: rgba(255,255,255,.85); }
  .shoot {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: 84px; height: 84px; border-radius: 50%; border: 5px solid #fff; background: rgba(255,255,255,.25);
  }
  .shoot::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: #fff; }
  .shoot:active::after { inset: 10px; }
  .shoot:disabled { opacity: .4; }
  .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .flash.on { opacity: .8; transition: none; }
  .fallback { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center; padding: 24px; }
  .fallback p { margin: 0; color: #bbb; font-size: 14px; }
  .btn { display: block; background: #1E4E9C; color: #fff; font-size: 20px; font-weight: 700; padding: 20px 28px; border-radius: 16px; border: 0; font-family: inherit; }
  .toast {
    position: fixed; left: 16px; right: 16px; top: 40%; transform: translateY(-50%); text-align: center;
    background: rgba(20,22,24,.92); border-radius: 18px; padding: 22px 16px; font-size: 16px; display: none;
  }
  .toast.show { display: block; }
  .toast b { display: block; font-size: 22px; margin-bottom: 4px; }
  .toast.ok b { color: #5BD18C; }
  .toast.err b { color: #FF7A6B; }
  .toast button { margin-top: 14px; background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 10px; padding: 8px 14px; font: inherit; font-size: 14px; }
  .reg { position: fixed; inset: 0; background: #111; display: grid; place-content: center; gap: 12px; padding: 24px; text-align: center; }
  .reg input { font-size: 28px; text-align: center; padding: 10px; border-radius: 10px; border: 0; width: 220px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<div class="top"><span class="slot" id="slot">カメラ起動中…</span></div>
<div class="guide" id="guide" hidden><span>距離計（ODO）の数字をこの枠に</span></div>
<button class="shoot" id="shoot" aria-label="撮影して送信" disabled></button>
<div class="flash" id="flash"></div>

<!-- カメラ映像が使えない端末用：標準カメラを開く -->
<div class="fallback" id="fallback" hidden>
  <label class="btn">カメラを開く<input id="file" type="file" accept="image/*" capture="environment" hidden></label>
  <p id="fallbackMsg"></p>
</div>

<div class="reg" id="reg" hidden>
  <div>社員番号（6桁）を登録してください</div>
  <input id="empId" inputmode="numeric" maxlength="6" autocomplete="off">
  <button class="btn" id="regBtn">登録する</button>
</div>

<div class="toast" id="toast"><div id="toastMsg"></div><button id="toastBtn" hidden></button></div>
<canvas id="canvas" hidden></canvas>

<script>
/* ===== 設定（記録用LIFFの index.html と同じ GAS_URL） ===== */
const LIFF_ID = 'ここにこの撮影用LIFFのLIFF ID';
const GAS_URL = 'ここにGASウェブアプリのURL（/exec）';
const MAX_EDGE = 1600;       // 送信する画像の長辺（px）
const JPEG_Q = 0.85;
const AUTO_CLOSE_MS = 2500;  // 保存完了後に自動で閉じるまでの時間（0で閉じない）

const $ = (id) => document.getElementById(id);
const LABEL = { 8: '出発', 9: '帰宅' };
let nextCol = null, busy = false, closeTimer = null;

/* ===== 1. 開いた瞬間にカメラ起動（LINEの初期化を待たない） ===== */
startCamera();
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    });
    $('video').srcObject = stream;
    await $('video').play();
    $('shoot').disabled = false;
    $('guide').hidden = false;
    updateSlot();
  } catch (e) {
    $('video').hidden = true; $('shoot').hidden = true;
    $('fallback').hidden = false;
    $('fallbackMsg').textContent = 'カメラ映像を表示できないため、標準のカメラで撮影します。';
    updateSlot();
  }
}

/* ===== 2. 並行して LINE 初期化とサーバー準備 ===== */
const ready = (async () => {
  if (!window.liff) await new Promise((res) => $('liffsdk').addEventListener('load', res));
  await liff.init({ liffId: LIFF_ID });
  if (!liff.isLoggedIn()) { liff.login(); return new Promise(() => {}); }
  return liff.getIDToken();
})();

async function api(action, data = {}) {
  const idToken = await ready;
  const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action, idToken, ...data }) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '通信エラー');
  return j;
}
function fire(action, data) {
  ready.then((idToken) => fetch(GAS_URL, { method: 'POST', keepalive: true,
    body: JSON.stringify({ action, idToken, ...data }) })).catch(() => {});
}

api('status').then((s) => {
  if (!s.registered) { $('reg').hidden = false; return; }
  nextCol = s.next;
  updateSlot();
  flushOutbox();
}).catch((e) => toast('エラー', e.message, 'err'));

function updateSlot() {
  if (!$('video').srcObject && $('fallback').hidden) return;
  $('slot').textContent = nextCol ? LABEL[nextCol] + 'の距離計を撮影' : '距離計を撮影';
}

/* ===== 3. シャッター → その場で送信 ===== */
$('shoot').addEventListener('click', () => {
  if (busy) return;
  const v = $('video');
  if (!v.videoWidth) return;
  flash();
  const k = Math.min(1, MAX_EDGE / Math.max(v.videoWidth, v.videoHeight));
  const c = $('canvas');
  c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  v.pause(); // 撮った画面で止める
  send(c.toDataURL('image/jpeg', JPEG_Q).split(',')[1], Date.now());
});

// 標準カメラで撮った場合
$('file').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const takenAt = Date.now();
  let src;
  try { src = await createImageBitmap(f, { imageOrientation: 'from-image' }); }
  catch (_) { src = await new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = j; i.src = URL.createObjectURL(f); }); }
  const k = Math.min(1, MAX_EDGE / Math.max(src.width, src.height));
  const c = $('canvas');
  c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  send(c.toDataURL('image/jpeg', JPEG_Q).split(',')[1], takenAt);
});

async function send(image, takenAt) {
  busy = true;
  $('shoot').disabled = true;
  toast('保存中…', '', '');
  try {
    const r = await api('upload', { image, takenAt });
    fire('process', { fileId: r.fileId });   // AI読み取りを依頼（待たない）
    nextCol = 9;
    toast('✅ 保存完了', r.name + '<br>閉じても大丈夫です', 'ok', {
      label: r.otherLabel + 'に変更',
      onClick: async () => {
        clearTimeout(closeTimer);
        try { const s = await api('swap', { fileId: r.fileId }); toast('✅ 変更しました', s.name, 'ok'); autoClose(); }
        catch (e) { toast('エラー', e.message, 'err'); }
      },
    });
    autoClose();
  } catch (e) {
    const saved = await outbox.add({ image, takenAt }).then(() => true).catch(() => false);
    toast('送信できませんでした', saved ? '写真は端末に保存しました。次に開いたとき自動で送ります。' : e.message, 'err');
    resume();
  }
}

function autoClose() {
  if (!AUTO_CLOSE_MS) return resume();
  clearTimeout(closeTimer);
  closeTimer = setTimeout(() => {
    const s = $('video').srcObject;
    if (s) s.getTracks().forEach((t) => t.stop());
    liff.closeWindow();
  }, AUTO_CLOSE_MS);
}
function resume() {
  busy = false;
  $('shoot').disabled = false;
  if ($('video').srcObject) $('video').play();
  updateSlot();
}

/* ===== 送れなかった写真（端末に保存して次回自動送信） ===== */
const outbox = {
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('odo-outbox', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('q', { keyPath: 'id', autoIncrement: true });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('q', mode); const q = fn(t.objectStore('q'));
      t.oncomplete = () => res(q.result); t.onerror = () => rej(t.error);
    });
  },
  add(x) { return this.run('readwrite', (s) => s.add(x)); },
  all() { return this.run('readonly', (s) => s.getAll()); },
  del(id) { return this.run('readwrite', (s) => s.delete(id)); },
};
async function flushOutbox() {
  let items = [];
  try { items = await outbox.all(); } catch (_) { return; }
  for (const it of items) {
    try {
      const r = await api('upload', { image: it.image, takenAt: it.takenAt });
      await outbox.del(it.id);
      fire('process', { fileId: r.fileId });
    } catch (_) { return; }
  }
  if (items.length) api('status').then((s) => { nextCol = s.next; updateSlot(); }).catch(() => {});
}

/* ===== 初回登録（未登録の人だけ） ===== */
$('regBtn').addEventListener('click', async () => {
  try {
    const s = await api('register', { empId: $('empId').value.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)) });
    $('reg').hidden = true;
    nextCol = s.next; updateSlot();
    toast('登録しました', s.name + ' さん', 'ok'); setTimeout(() => $('toast').classList.remove('show'), 2000);
  } catch (e) { toast('エラー', e.message, 'err'); }
});

/* ===== 表示 ===== */
function flash() { const f = $('flash'); f.classList.add('on'); requestAnimationFrame(() => f.classList.remove('on')); }
function toast(title, body, kind, action) {
  const t = $('toast');
  $('toastMsg').innerHTML = '<b>' + title + '</b>' + (body || '');
  t.className = 'toast show ' + (kind || '');
  const b = $('toastBtn');
  if (action) { b.hidden = false; b.textContent = action.label; b.onclick = action.onClick; } else { b.hidden = true; }
  if (kind === 'err') setTimeout(() => t.classList.remove('show'), 6000);
}
</script>
</body>
</html>
